<title>First Things First</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* ── one committed visual world: blush, soft, bright ────────────────────── */
:root{
  color-scheme: light;                 /* keep native controls light in a dark OS */
  --ground:#FFF7F9; --ground-2:#FFEFF4;
  --surface:#FFFFFF; --surface-2:#FFF1F5; --surface-3:#FFE4EC;
  --border:#FBDCE5; --border-2:#F5C3D3;
  --ink:#43262F; --ink-2:#7C5A66; --ink-3:#AE8F9B;
  --pink:#E8497D; --pink-deep:#C9296A; --pink-wash:#FFE7EF;
  --coral:#FF8A6B;
  --d-faith:#7A43C9; --d-paid:#C07A0A; --d-build:#D62C72; --d-life:#0F8060;
  --ok:#0F8060; --late:#C0392B; --late-wash:#FFEAE6;
  --sh:0 1px 2px rgba(200,120,150,.10), 0 10px 30px -18px rgba(190,90,130,.42);
  --sh-lift:0 2px 4px rgba(200,120,150,.12), 0 18px 40px -20px rgba(190,90,130,.5);
  --r:18px; --r-2:12px; --r-3:9px;
  --sans:"Nunito Sans",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-3);padding:9px 11px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:hover,select:hover,textarea:hover{border-color:var(--border-2)}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── header ─────────────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:30;background:rgba(255,247,249,.9);backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--border)}
.hin{max-width:1140px;margin:0 auto;padding:16px 22px 12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.brand em{font-style:normal;color:var(--pink)}
.today-lab{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.01em}
.hin .sp{flex:1}
.tabs{display:flex;gap:5px;background:var(--ground-2);padding:4px;border-radius:999px;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 17px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--pink-deep)}
.tab[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 2px 8px -2px rgba(232,73,125,.55)}
.gear{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);flex:0 0 auto}
.gear:hover{border-color:var(--pink);color:var(--pink)}
.gear[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}

/* ── page ───────────────────────────────────────────────────────────────── */
main{max-width:1140px;margin:0 auto;padding-inline:22px;padding-block:26px 80px}
.h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.h2 h2{font-size:30px}
.h2 .sub{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.h2 .sp{flex:1}

.card{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.card.tint{background:var(--surface-2);box-shadow:none}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-size:17px} .ch .sp{flex:1}
.grid{display:grid;gap:16px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}

.btn{background:var(--surface-2);border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;
  color:var(--pink-deep)}
.btn:hover{background:var(--surface-3)}
.btn.solid{background:var(--pink);color:#fff;box-shadow:0 2px 10px -3px rgba(232,73,125,.6)}
.btn.solid:hover{background:var(--pink-deep)}
.btn.quiet{background:none;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;
  padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
.tag.late{background:var(--late-wash);color:var(--late)}
.tag.live{background:var(--pink);color:#fff}
.tag.rep{background:#EDE4FF;color:var(--d-faith)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.empty{border-radius:var(--r-2);padding:20px;background:var(--surface-2);color:var(--ink-2);font-size:14px}

/* ── the day arc ────────────────────────────────────────────────────────── */
.arc-wrap{background:var(--surface);border-radius:var(--r);padding:16px 22px 18px;box-shadow:var(--sh);
  margin-bottom:18px}
.arc{position:relative;height:26px;border-radius:999px;background:var(--ground-2);margin:6px 0 4px}
.seg{position:absolute;top:5px;height:16px;border-radius:999px;background:var(--c);opacity:.45;
  border-right:2px solid var(--surface)}
.seg.on{opacity:1}
.arc .pin{position:absolute;top:-5px;bottom:-5px;width:2.5px;background:var(--ink);border-radius:2px}
.arc .pin::after{content:"";position:absolute;left:-3.5px;top:-4px;width:9px;height:9px;border-radius:50%;
  background:var(--ink)}
.arc-sc{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}

/* ── one thing ──────────────────────────────────────────────────────────── */
.one{background:linear-gradient(135deg,var(--pink-wash),var(--surface-2));border-radius:var(--r);
  padding:16px 20px 18px;box-shadow:var(--sh)}
.one input{width:100%;margin-top:8px;font-size:16px;font-weight:600;border-color:var(--border-2);
  background:var(--surface);border-radius:var(--r-2);padding:11px 13px}

/* ── day spine ──────────────────────────────────────────────────────────── */
.spine{display:flex;flex-direction:column;gap:7px}
.blk{display:grid;grid-template-columns:52px 1fr auto;gap:14px;align-items:center;background:var(--surface);
  border-radius:var(--r-2);padding:11px 14px 11px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.blk::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.blk .t{font-family:var(--mono);font-size:11px;color:var(--ink-3);line-height:1.4}
.blk .lbl{font-weight:700;font-size:14.5px;line-height:1.35}
.blk .mt{font-size:11.5px;color:var(--ink-3);margin-top:1px}
.blk.now{box-shadow:var(--sh-lift),0 0 0 2.5px var(--pink)}
.blk.done{background:var(--surface-2);box-shadow:none}
.blk.done .lbl{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--ink-3)}
.blk.skip{opacity:.45;box-shadow:none}
.blk.skip .lbl{text-decoration:line-through}
.acts{display:flex;gap:5px}
.tick{width:31px;height:31px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;
  font-size:13px;color:var(--ink-3);line-height:1}
.card.tint .tick{background:var(--surface);box-shadow:inset 0 0 0 1.5px var(--border)}
.tick:hover{background:var(--surface-3);color:var(--pink-deep)}
.tick[aria-pressed="true"]{background:var(--pink);color:#fff}
.tick.x[aria-pressed="true"]{background:var(--ink-3)}
.nowmark{display:flex;align-items:center;gap:9px;padding:2px 0}
.nowmark .ln{flex:1;height:2px;background:var(--pink);border-radius:2px;opacity:.5}
.nowmark .tx{font-family:var(--mono);font-size:10.5px;font-weight:500;color:var(--pink-deep)}

/* ── checks ─────────────────────────────────────────────────────────────── */
.chk{display:flex;align-items:center;gap:12px;padding:6px 0}
.chk .nm{flex:1;font-size:14.5px;font-weight:600}
.chk .st{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.box{width:27px;height:27px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);
  display:grid;place-items:center;font-size:13px;line-height:1;color:transparent;flex:0 0 auto;padding:0}
.box:hover{border-color:var(--c,var(--pink))}
.box[aria-pressed="true"]{background:var(--c,var(--pink));border-color:var(--c,var(--pink));color:#fff}

/* ── timer ──────────────────────────────────────────────────────────────── */
.clk{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.clk.idle{color:var(--ink-3)}

/* ── meters ─────────────────────────────────────────────────────────────── */
.meter{height:9px;border-radius:999px;background:var(--ground-2);position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c)}
.notch{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink-2);border-radius:2px;
  opacity:.65}

/* ── week grid ──────────────────────────────────────────────────────────── */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
@media (max-width:940px){.wk{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:500px){.wk{grid-template-columns:1fr}}
.day{background:var(--surface);border-radius:var(--r-2);padding:13px 13px 15px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:8px}
.day.now{box-shadow:var(--sh-lift),0 0 0 2.5px var(--pink)}
.day.sun{background:var(--surface-2);box-shadow:none}
.day .dh{display:flex;align-items:baseline;gap:7px}
.day .dn{font-family:var(--serif);font-size:16px;font-weight:600}
.day .dd{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-left:auto}
.wb{display:flex;gap:8px;font-size:11.5px;line-height:1.35}
.wb .bar{width:4px;border-radius:2px;background:var(--c);flex:0 0 auto}
.wb .tm{display:block;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
.domrow{display:grid;grid-template-columns:minmax(112px,150px) minmax(0,1fr) 84px;gap:14px;align-items:center}
@media (max-width:560px){.domrow{grid-template-columns:1fr}.domrow .n{text-align:left}}
.domrow .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px}
.domrow .n{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
.trow{display:grid;grid-template-columns:minmax(0,1fr) 128px 78px;gap:14px;align-items:center;padding:9px 0}
.trow+.trow{border-top:1.5px solid var(--border)}
@media (max-width:700px){.trow{grid-template-columns:minmax(0,1fr) 78px;gap:6px 12px}
  .trow .mw{grid-column:1/-1;order:3}}
.trow .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.trow .nm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .nx{font-size:12px;color:var(--ink-3);margin-top:1px;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.trow .n{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}

/* ── tasks & entries ────────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;gap:13px;align-items:center;background:var(--surface);border-radius:var(--r-2);
  padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.item.done{background:var(--surface-2);box-shadow:none}
.item.done::before{opacity:.3}
.item.done .tt{color:var(--ink-3);text-decoration:line-through}
.item .tt{font-weight:700;font-size:14.5px;line-height:1.35}
.item .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;
  align-items:center}
.item .sp{flex:1;min-width:0}
.x{width:26px;height:26px;border-radius:50%;color:var(--ink-3);font-size:16px;line-height:1;flex:0 0 auto}
.x:hover{background:var(--late-wash);color:var(--late)}
.addbar{display:grid;grid-template-columns:minmax(0,1fr) 166px 140px 74px auto;gap:9px}
@media (max-width:780px){.addbar{grid-template-columns:1fr 1fr}.addbar>*:first-child{grid-column:1/-1}}

/* ── report ─────────────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-2);padding:15px 17px;box-shadow:var(--sh)}
.stat .k{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:600}
.chart{display:flex;flex-direction:column;gap:9px}
.crow{display:grid;grid-template-columns:minmax(118px,192px) minmax(0,1fr) 86px;gap:14px;align-items:center}
@media (max-width:620px){.crow{grid-template-columns:1fr;gap:4px}.crow .v{text-align:left}}
.crow .l{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.crow .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr{position:relative;height:20px;background:var(--ground-2);border-radius:999px}
.cbar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:999px;min-width:3px;
  border-right:2px solid var(--surface)}
.cbar.zero{background:var(--border-2)}
.crow .v{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  border-top:1.5px solid var(--border);padding-top:6px;margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hm{display:grid;grid-template-columns:minmax(92px,148px) repeat(7,minmax(0,1fr)) 52px;gap:5px;align-items:center}
.hm .hd{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center}
.hm .rl{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:24px;border-radius:7px;background:var(--surface-3)}
.cell.on{background:var(--c)}
.cell.soon{background:none;box-shadow:inset 0 0 0 1.5px var(--border)}
.hm .rn{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
.narr{font-family:var(--serif);font-size:17px;line-height:1.65;max-width:62ch}
.narr p+p{margin-top:.75em;border-top:1.5px solid var(--border);padding-top:.75em}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--border)}
table.data th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
table.data td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:10px 14px;align-items:center;font-size:14px}
textarea.json{width:100%;font-family:var(--mono);font-size:12px;line-height:1.55;min-height:250px}

/* ── scripture banner ───────────────────────────────────────────────────── */
.verse{background:linear-gradient(120deg,var(--pink-wash),#F3E9FF 78%);border-radius:var(--r);
  padding:17px 22px 19px;box-shadow:var(--sh);margin-bottom:18px}
.verse .vt{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin-top:7px;max-width:70ch;
  font-variation-settings:"SOFT" 100,"WONK" 1}
.verse .vr{font-size:12.5px;font-weight:700;color:var(--d-faith);margin-top:9px;letter-spacing:.02em}

/* ── today's load ───────────────────────────────────────────────────────── */
.loadbar-wrap{background:var(--surface);border-radius:var(--r);padding:16px 22px 18px;box-shadow:var(--sh);
  margin-bottom:18px}
.loadbar{height:22px;border-radius:999px;background:var(--ground-2);position:relative;margin:9px 0 0;
  overflow:hidden}
.loadbar .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--pink)}
.loadbar .cap{position:absolute;top:0;bottom:0;width:2.5px;background:var(--ink-2);opacity:.55}
.loadnote{font-size:13px;color:var(--ink-2);margin-top:10px}

/* ── inline task editor ─────────────────────────────────────────────────── */
.item.edit{align-items:stretch;box-shadow:var(--sh-lift)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 86px auto;gap:9px;align-items:center;margin-top:9px}
@media (max-width:640px){.erow{grid-template-columns:1fr 86px}.erow>*:last-child{grid-column:1/-1}}
.chipday{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:var(--surface-2);
  color:var(--ink-2)}
.chipday:hover{background:var(--surface-3);color:var(--pink-deep)}
.chipday.on{background:var(--pink);color:#fff}
.chipday.rest{color:var(--ink-3);opacity:.7}
.chipday.rest::after{content:" ·rest";font-size:9.5px;letter-spacing:.04em}
.chipday.rest.on{background:var(--ink-3);color:#fff;opacity:1}
.pencil{width:28px;height:28px;border-radius:50%;color:var(--ink-3);font-size:13px;flex:0 0 auto;
  display:grid;place-items:center}
.pencil:hover{background:var(--surface-2);color:var(--pink-deep)}

/* ── brain dump ─────────────────────────────────────────────────────────── */
.dump textarea{width:100%;font-size:15px;line-height:1.6;min-height:120px;border-radius:var(--r-2);
  border-color:var(--border-2)}
.props{margin-top:18px;border-top:1.5px solid var(--border);padding-top:16px}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;
  background:var(--surface-2);border-radius:var(--r-2);padding:12px 14px;margin-bottom:8px;
  border-left:5px solid var(--c)}
.prop input[type=text]{width:100%;font-weight:700;background:var(--surface)}
.prop .pr2{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;margin-top:8px}
.prop .days{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ── tasks inside the week grid ─────────────────────────────────────────── */
.wt{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.35;
  background:var(--surface-2);border-radius:8px;padding:6px 8px;border-left:4px solid var(--c)}
.wt .tb{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);
  flex:0 0 auto;padding:0;margin-top:1px}
.wt .tb:hover{border-color:var(--c)}
.wt.late{border-left-color:var(--late)}
.day .sect{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin-top:4px}

#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;
  font-weight:600;padding:7px 11px;border-radius:9px;max-width:250px;opacity:0;transition:opacity .12s;
  box-shadow:var(--sh-lift)}
#tip.on{opacity:1}
#tip b{color:#FFC9DB}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--sh-lift);z-index:90;
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}

/* ── dates ─────────────────────────────────────────────────────────────── */
const DAYNAME  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAYSHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONSUN   = [1,2,3,4,5,6,0];
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const toMin = t => { const [h,m] = t.split(":").map(Number); return h*60+m; };
const dur = b => Math.max(0, toMin(b.end)-toMin(b.start));
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/86400000);
function weekKey(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(),0,4);
  return t.getFullYear()+"-W"+pad(1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7));
}
const hm = m => { m = Math.round(m); if (m <= 0) return "0m";
  const h = Math.floor(m/60), r = m%60; return h&&r ? h+"h "+r+"m" : h ? h+"h" : r+"m"; };
const clock = t => { const [h,m] = t.split(":").map(Number);
  return (h%12===0?12:h%12) + (m?":"+pad(m):"") + (h<12?"a":"p"); };

/* ── storage ───────────────────────────────────────────────────────────── */
const Store = {
  db:null, mode:"local",
  async connect(){
    try { const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      if (db) { this.db = db; this.mode = "db"; } } catch (_) {}
    return this.mode;
  },
  async get(p){
    if (this.db) { try { const s = await this.db.doc(p).get(); return s.exists ? s.data() : null; }
      catch (_) { return null; } }
    try { const r = localStorage.getItem("ftf:"+p); return r ? JSON.parse(r) : null; } catch (_) { return null; }
  },
  async set(p,o){
    if (this.db) { try { await this.db.doc(p).set(o); return true; }
      catch (e) { toast(e && e.code === "quota_exceeded"
        ? "Store is full — export and prune in Setup." : "Could not save just now."); return false; } }
    try { localStorage.setItem("ftf:"+p, JSON.stringify(o)); return true; }
    catch (_) { toast("This browser refused to save."); return false; }
  },
};

/* ── state ─────────────────────────────────────────────────────────────── */
const S = {
  cfg:null, tasks:{ items:[] }, checks:{}, week:{ entries:[], days:{} }, weekKey:"",
  timer:null, tab:"today", offset:0, showTable:false, narrative:"", prio:2,
  dump:{ text:"", proposals:[], busy:false }, editing:null,
};
const track = id => S.cfg.tracks.find(t => t.id === id) || { id, name:id, dom:"life", target:0 };
const domVar = id => (DOMAINS.find(d => d.id === id) || DOMAINS[3]).v;
const tv = id => domVar(track(id).dom);
const domName = id => (DOMAINS.find(d => d.id === id) || DOMAINS[3]).name;

const timers = {};
const queue = (p,get) => { clearTimeout(timers[p]); timers[p] = setTimeout(() => Store.set(p,get()), 350); };
const saveCfg    = () => queue("app/config", () => S.cfg);
const saveTasks  = () => queue("app/tasks",  () => S.tasks);
const saveChecks = () => queue("app/checks", () => S.checks);
const saveWeek   = () => queue("logs/"+S.weekKey, () => S.week);
const saveTimer  = () => Store.set("app/timer", S.timer || { off:true });
const saveDump   = () => queue("app/dump", () => ({ text:S.dump.text, proposals:S.dump.proposals }));

async function loadWeek(key){
  S.weekKey = key;
  const w = await Store.get("logs/"+key);
  S.week = w && Array.isArray(w.entries) ? w : { entries:[], days:{} };
  if (!S.week.days) S.week.days = {};
}
const dayRec = d => (S.week.days[d] = S.week.days[d] || { blocks:{}, one:"", note:"", energy:0 });
const entriesOn = d => S.week.entries.filter(e => e.date === d);
const loggedOn = d => entriesOn(d).reduce((s,e) => s+e.min, 0);

function addEntry(trackId, min, label, date){
  if (!(min > 0)) return null;
  const d = date || ymd(new Date()), k = weekKey(parseYmd(d));
  const e = { id:Math.random().toString(36).slice(2,9), track:trackId, min:Math.round(min),
              label:label || track(trackId).name, date:d };
  if (k === S.weekKey) { S.week.entries.push(e); saveWeek(); }
  else Store.get("logs/"+k).then(w => {
    const wk = w && Array.isArray(w.entries) ? w : { entries:[], days:{} };
    wk.entries.push(e); Store.set("logs/"+k, wk);
  });
  return e;
}

const isChecked = (h,d) => !!(S.checks[h] && S.checks[h][d]);
function toggleHabit(h,d){
  S.checks[h] = S.checks[h] || {};
  if (S.checks[h][d]) delete S.checks[h][d]; else S.checks[h][d] = 1;
  saveChecks();
}
const checkOn = (h,d) => { S.checks[h] = S.checks[h] || {}; S.checks[h][d] = 1; saveChecks(); };
function streak(h){
  const due = new Set(h.days), today = ymd(new Date());
  let n = 0, d = new Date(), g = 0;
  while (g++ < 500) {
    const k = ymd(d);
    if (due.has(d.getDay())) { if (isChecked(h.id,k)) n++; else if (k !== today) break; }
    d = addDays(d,-1);
  }
  return n;
}

const PRIO = { 1:"Must", 2:"Should", 3:"Someday" };
const REPEATS = { "":"Once", daily:"Every day", weekdays:"Weekdays", weekly:"Weekly" };

/* the next date a repeating task is due, counted from the one it just filled */
function nextOccurrence(t){
  const base = t.due ? parseYmd(t.due) : new Date();
  if (t.rep === "daily") return ymd(addDays(base,1));
  if (t.rep === "weekdays") { let d = addDays(base,1);
    while (d.getDay() === 0 || d.getDay() === 6) d = addDays(d,1); return ymd(d); }
  if (t.rep === "weekly") return ymd(addDays(base,7));
  return "";
}
const repeatLabel = t => !t.rep ? "" : t.rep === "weekly"
  ? "every " + DAYNAME[(t.due ? parseYmd(t.due) : new Date()).getDay()]
  : REPEATS[t.rep].toLowerCase();

/* ticking a task is now the main way time gets logged */
function completeTask(t, date){
  t.done = true; t.doneAt = date;
  if (t.est > 0) {
    const e = addEntry(t.k, t.est, t.t, date);
    t.entry = e && e.id;
  }
  if (t.rep) {
    const due = nextOccurrence(t);
    S.tasks.items.push({ id:Math.random().toString(36).slice(2,9), t:t.t, k:t.k, p:t.p,
      est:t.est, due, rep:t.rep, done:false });
    return due;
  }
  return "";
}
function uncompleteTask(t){
  if (t.entry) { S.week.entries = S.week.entries.filter(e => e.id !== t.entry); saveWeek(); }
  t.done = false; t.doneAt = null; t.entry = null;
}
function bucket(t){
  const today = ymd(new Date());
  if (t.done) return "done";
  if (!t.due) return "later";
  if (t.due < today) return "late";
  if (t.due === today) return "today";
  return t.due <= ymd(addDays(mondayOf(new Date()),6)) ? "week" : "later";
}

const dayOfYear = d => Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())
  - new Date(d.getFullYear(),0,0))/86400000);
function verseFor(d){
  const l = S.cfg && Array.isArray(S.cfg.verses) && S.cfg.verses.length ? S.cfg.verses : VERSES;
  const v = l[dayOfYear(d) % l.length];
  return Array.isArray(v) ? v : [v && v.ref || "", v && v.text || String(v)];
}
const assignedTo = d => S.tasks.items.filter(t => !t.done && t.due === d);
const trackOpts = sel => S.cfg.tracks.map(k =>
  `<option value="${k.id}" ${sel===k.id?"selected":""}>${esc(k.name)}</option>`).join("");
/* 7 days from today, plus "no day" — the whole scheduling gesture is one tap */
function dayChips(sel, attr, id){
  const out = [];
  for (let i = 0; i < 7; i++) {
    const d = addDays(new Date(), i), k = ymd(d);
    const rest = d.getDay() === 0;
    out.push(`<button class="chipday ${sel===k?"on":""} ${rest?"rest":""}" data-${attr}="${id}:${k}"
      ${rest?'title="Sunday is a rest day"':""}>${
      i===0?"Today":i===1?"Tomorrow":DAYSHORT[d.getDay()]}</button>`);
  }
  out.push(`<button class="chipday ${sel?"":"on"}" data-${attr}="${id}:">No day</button>`);
  return out.join("");
}

const esc = s => String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
  .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const $  = (s,r) => (r||document).querySelector(s);
const $$ = (s,r) => Array.from((r||document).querySelectorAll(s));
let tT;
function toast(m){ const e = $("#toast"); e.textContent = m; e.classList.add("on");
  clearTimeout(tT); tT = setTimeout(() => e.classList.remove("on"), 2600); }
function bindTips(root){
  $$("[data-tip]", root).forEach(el => {
    el.addEventListener("mouseenter", () => { const t = $("#tip"); t.innerHTML = el.dataset.tip; t.classList.add("on"); });
    el.addEventListener("mousemove", ev => { const t = $("#tip"), r = t.getBoundingClientRect();
      t.style.left = Math.min(innerWidth-r.width-10, ev.clientX+13)+"px";
      t.style.top  = Math.max(8, ev.clientY-r.height-11)+"px"; });
    el.addEventListener("mouseleave", () => $("#tip").classList.remove("on"));
  });
}

/* ═══ TODAY ══════════════════════════════════════════════════════════════ */
const ARC_FROM = 300, ARC_TO = 1380;          // 5am → 11pm
const arcPct = m => Math.max(0, Math.min(100, (m-ARC_FROM)/(ARC_TO-ARC_FROM)*100));

function dayArc(blocks, rec, nowMin){
  const segs = blocks.map((b,i) => {
    const l = arcPct(toMin(b.start)), w = Math.max(.7, arcPct(toMin(b.end))-l);
    return `<div class="seg ${rec.blocks[i]==="done"?"on":""}" style="--c:var(${tv(b.track)});left:${l}%;width:${w}%"
      data-tip="<b>${esc(b.label)}</b><br>${clock(b.start)}–${clock(b.end)} · ${hm(dur(b))}"></div>`;
  }).join("");
  const inRange = nowMin >= ARC_FROM && nowMin <= ARC_TO;
  return `<div class="arc-wrap">
    <div class="row"><span class="lab">The day</span><span class="sp"></span>
      <span class="dim mono" style="font-size:11px">5a — 11p</span></div>
    <div class="arc">${segs}${inRange?`<div class="pin" style="left:${arcPct(nowMin)}%"></div>`:""}</div>
    <div class="arc-sc"><span>5a</span><span>9a</span><span>1p</span><span>5p</span><span>9p</span><span>11p</span></div>
  </div>`;
}

function viewToday(){
  const now = new Date(), date = ymd(now), dow = now.getDay();
  const blocks = S.cfg.rhythm[dow] || [], rec = dayRec(date);
  const nowMin = now.getHours()*60 + now.getMinutes();

  const mine = S.tasks.items.filter(t => t.due === date)
    .sort((a,b) => (a.done?1:0)-(b.done?1:0) || a.p-b.p);
  const openT = mine.filter(t => !t.done);
  const load = openT.reduce((s,t) => s+(t.est||0), 0);
  const doneMin = mine.filter(t => t.done).reduce((s,t) => s+(t.est||0), 0);
  const total = load + doneMin;
  const late = S.tasks.items.filter(t => bucket(t) === "late");

  const habits = S.cfg.habits.filter(h => h.days.includes(dow)).map(h => {
    const on = isChecked(h.id, date), st = streak(h);
    return `<div class="chk" style="--c:var(${tv(h.track)})">
      <button class="box" data-habit="${h.id}" aria-pressed="${on}" aria-label="${esc(h.name)}">✓</button>
      <span class="nm">${esc(h.name)}</span>
      <span class="st">${st ? st+"d" : "—"}</span></div>`;
  }).join("");

  let spine = "";
  if (blocks.length) {
    spine = `<div class="card tint"><div class="row" style="margin-bottom:10px">
      <span class="lab">Fixed commitments</span></div><div class="spine">` +
      blocks.map((b,i) => {
        const st = rec.blocks[i] || "";
        const isNow = nowMin >= toMin(b.start) && nowMin < toMin(b.end);
        return `<div class="blk ${st} ${isNow?"now":""}" style="--c:var(${tv(b.track)})">
          <div class="t">${clock(b.start)}<br>${clock(b.end)}</div>
          <div><div class="lbl">${esc(b.label)}</div>
            <div class="mt">${esc(track(b.track).name)} · ${hm(dur(b))}</div></div>
          <div class="acts">
            <button class="tick" data-blk="${i}" data-act="done" aria-pressed="${st==="done"}"
              title="Did it — logs ${hm(dur(b))}">✓</button>
            <button class="tick x" data-blk="${i}" data-act="skip" aria-pressed="${st==="skip"}"
              title="Skipped">✕</button></div></div>`;
      }).join("") + `</div></div>`;
  }

  return `
  <div class="h2"><h2>${DAYNAME[dow]}</h2>
    <span class="sub">${total
      ? hm(doneMin)+" done of "+hm(total)+" planned · "+mine.filter(t=>t.done).length+"/"+mine.length+" tasks"
      : "nothing assigned to today yet"}</span>
    ${dow===0?'<span class="tag live">rest day</span>':""}</div>

  ${verseCard()}

  ${total ? `<div class="loadbar-wrap">
    <div class="row"><span class="lab">Today's load</span><span class="sp"></span>
      <span class="mono dim" style="font-size:11.5px">${hm(load)} left</span></div>
    <div class="loadbar"><div class="fill" style="width:${Math.min(100,doneMin/total*100)}%"></div>
      <div class="cap" style="left:${Math.min(100, 240/Math.max(total,240)*100)}%"
        data-tip="Four hours — about what one evening after teaching actually holds"></div></div>
    <p class="loadnote">${load > 300
      ? "<b>That is more than an evening holds.</b> Move something to another day rather than failing it here."
      : load > 0 ? "Realistic. Start at the top and do not reorder mid-flight."
      : "Everything assigned to today is done."}</p>
  </div>` : ""}

  <div class="two">
    <div class="grid">
      <div class="one">
        <span class="lab">One thing today</span>
        <input id="one" value="${esc(rec.one)}" placeholder="Write it. One sentence."
          aria-label="The one thing that matters today">
      </div>

      <div class="card">
        <div class="ch"><h3>Today's tasks</h3><span class="sp"></span>
          ${late.length?`<button class="btn sm" id="pullate">Pull ${late.length} late in</button>`:""}
          <button class="btn quiet sm" id="gotodump">Brain dump →</button></div>
        ${mine.length ? `<div class="list">${mine.map(taskRow).join("")}</div>`
          : `<div class="empty">Nothing assigned to today. Write a brain dump, break it into tasks,
             and tap <b>All → Today</b>.</div>`}
      </div>

      ${spine}

      <div class="card tint">
        <div class="row"><span class="lab">Close the day</span><span class="sp"></span>
          ${[1,2,3,4,5].map(n => `<button class="tick" data-energy="${n}"
            aria-pressed="${rec.energy===n}" title="Energy ${n} of 5">${n}</button>`).join("")}</div>
        <textarea id="note" rows="2" style="width:100%;margin-top:11px"
          placeholder="One line — what actually happened?" aria-label="Note about today">${esc(rec.note)}</textarea>
      </div>
    </div>

    <div class="grid">
      ${timerCard()}
      <div class="card">
        <div class="ch"><h3>Today's checks</h3><span class="sp"></span><span class="lab">streak</span></div>
        ${habits}
      </div>
      ${bibleCard()}
    </div>
  </div>`;
}

function verseCard(){
  const [ref, text] = verseFor(new Date());
  if (!text) return "";
  return `<div class="verse">
    <span class="lab">Today's verse</span>
    <p class="vt">\u201c${esc(text)}\u201d</p>
    <p class="vr">${esc(ref)}<span class="dim" style="font-weight:600"> \u00b7 KJV</span></p>
  </div>`;
}

function bibleCard(){
  const bp = S.cfg.bible;
  const elapsed = Math.max(0, daysBetween(bp.start, ymd(new Date()))+1);
  const target = Math.min(bp.total, elapsed);
  const behind = Math.max(0, target-bp.day);
  const closeIn = r => Math.ceil(behind/(r-1));
  return `<div class="card" style="--c:var(--d-faith)">
    <div class="ch"><h3>Reading plan</h3><span class="sp"></span>
      <span class="tag">${bp.total}-day</span></div>
    <div class="row" style="align-items:baseline;gap:8px">
      <span style="font-size:29px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em">${bp.day}</span>
      <span class="muted" style="font-size:13.5px">of ${bp.total} done</span></div>
    <div class="meter" style="margin-top:10px">
      <div class="fill" style="width:${Math.min(100,bp.day/bp.total*100)}%"></div>
      <div class="notch" style="left:${Math.min(100,target/bp.total*100)}%"></div></div>
    <p class="muted" style="font-size:13px;margin-top:10px">
      ${behind === 0 ? "On pace. One a day holds it."
        : `<b>${behind} behind.</b> Two a day closes it in ${closeIn(2)} days; three a day in ${closeIn(3)}.`}</p>
    <div class="row" style="margin-top:12px">
      <button class="btn sm" data-bible="1">+1</button>
      <button class="btn sm" data-bible="2">+2</button>
      <button class="btn quiet sm" data-bible="-1">−1</button>
      <span class="sp"></span>
      <input id="bday" class="mono" type="number" min="0" max="${bp.total}" value="${bp.day}"
        style="width:74px;padding:6px 8px" aria-label="Current reading number"></div>
  </div>`;
}

function timerCard(){
  const t = S.timer && S.timer.startedAt ? S.timer : null;
  const el = t ? Math.floor((Date.now()-t.startedAt)/1000) : 0;
  const disp = t ? pad(Math.floor(el/3600))+":"+pad(Math.floor(el/60)%60)+":"+pad(el%60) : "00:00:00";
  return `<div class="card">
    <div class="ch"><h3>Log time</h3><span class="sp"></span>
      <span class="tag ${t?"live":""}">${t?"running":"idle"}</span></div>
    <div class="clk ${t?"":"idle"}" id="clk">${disp}</div>
    ${t ? `<p class="muted" style="font-size:13px;margin-top:4px">${esc(t.label)}</p>` : ""}
    <div class="row" style="margin-top:13px">
      <select id="tsel" style="flex:1" aria-label="Which track">
        ${S.cfg.tracks.map(k => `<option value="${k.id}" ${t&&t.track===k.id?"selected":""}>${esc(k.name)}</option>`).join("")}
      </select>
      ${t ? `<button class="btn solid" id="tstop">Stop</button>
             <button class="btn quiet sm" id="tcancel">Discard</button>`
          : `<button class="btn solid" id="tstart">Start</button>`}
    </div>
    <div class="row" style="margin-top:11px">
      <span class="dim" style="font-size:12px">or add</span>
      ${[15,30,60,120].map(m => `<button class="btn sm" data-quick="${m}">+${m<60?m+"m":(m/60)+"h"}</button>`).join("")}
    </div>
  </div>`;
}

/* ═══ WEEK ═══════════════════════════════════════════════════════════════ */
function viewWeek(){
  const mon = mondayOf(new Date()), today = ymd(new Date());
  const days = MONSUN.map((dow,i) => {
    const date = ymd(addDays(mon,i));
    const list = (S.cfg.rhythm[dow] || []).filter(b => b.track !== "rest" || dur(b) >= 60);
    const hrs = (S.cfg.rhythm[dow] || []).reduce((s,b) => s+dur(b), 0);
    return `<div class="day ${date===today?"now":""} ${dow===0?"sun":""}">
      <div class="dh"><span class="dn">${DAYSHORT[dow]}</span><span class="dd">${parseYmd(date).getDate()}</span></div>
      ${list.map(b => `<div class="wb" style="--c:var(${tv(b.track)})"><div class="bar"></div>
        <div><span class="tm">${clock(b.start)}</span>${esc(b.label)}</div></div>`).join("")}
      ${(() => { const ts = assignedTo(date); if (!ts.length) return "";
        const mins = ts.reduce((s,t) => s+(t.est||0), 0);
        return `<div class="sect">tasks · ${hm(mins)}</div>` + ts.map(t =>
          `<div class="wt ${t.due < today ? "late" : ""}" style="--c:var(${tv(t.k)})">
            <button class="tb" data-task="${t.id}" aria-label="Done: ${esc(t.t)}"></button>
            <span>${esc(t.t)}</span></div>`).join(""); })()}
      <div class="dim mono" style="font-size:10px;margin-top:auto;padding-top:7px">${hm(hrs)}</div>
    </div>`;
  }).join("");

  const logged = {}, plan = {};
  S.week.entries.forEach(e => logged[e.track] = (logged[e.track]||0)+e.min);
  MONSUN.forEach(dow => (S.cfg.rhythm[dow]||[]).forEach(b => plan[b.track] = (plan[b.track]||0)+dur(b)));

  const domBars = DOMAINS.map(d => {
    const ts = S.cfg.tracks.filter(t => t.dom === d.id);
    const lg = ts.reduce((s,t) => s+(logged[t.id]||0), 0);
    const tg = ts.reduce((s,t) => s+t.target*60, 0);
    return `<div class="domrow" style="--c:var(${d.v})">
      <div class="nm"><span class="dot" style="background:var(${d.v})"></span>${d.name}</div>
      <div class="meter"><div class="fill" style="width:${tg?Math.min(100,lg/tg*100):0}%"></div></div>
      <div class="n">${hm(lg)} / ${hm(tg)}</div></div>`;
  }).join("");

  const trackRows = S.cfg.tracks.map(t => {
    const lg = logged[t.id]||0, tg = t.target*60;
    return `<div class="trow" style="--c:var(${tv(t.id)})">
      <div><div class="nm"><span class="dot" style="background:var(${tv(t.id)})"></span><span>${esc(t.name)}</span></div>
        <div class="nx">${esc(t.next||"")}</div></div>
      <div class="mw"><div class="meter"><div class="fill" style="width:${tg?Math.min(100,lg/tg*100):0}%"></div>
        ${plan[t.id]&&tg?`<div class="notch" style="left:${Math.min(100,plan[t.id]/tg*100)}%"></div>`:""}</div></div>
      <div class="n">${hm(lg)} / ${hm(tg)}</div></div>`;
  }).join("");

  const unplanned = S.tasks.items.filter(t => !t.done && !t.due)
    .sort((a,b) => a.p-b.p).slice(0,12);
  const schedule = unplanned.length ? `<div class="card" style="margin-top:18px">
    <div class="ch"><h3>Give these a day</h3><span class="sp"></span>
      <span class="lab">${S.tasks.items.filter(t => !t.done && !t.due).length} unscheduled</span></div>
    ${unplanned.map(t => `<div class="prop" style="--c:var(${tv(t.k)})">
      <div><div class="tt" style="font-weight:700;font-size:14px">${esc(t.t)}</div>
        <div class="mt" style="font-size:11.5px;color:var(--ink-3);margin-top:2px">
          ${esc(track(t.k).name)}${t.est?" · "+hm(t.est):""} · ${PRIO[t.p]}</div>
        <div class="days">${dayChips("", "ed", t.id)}</div></div>
      <button class="pencil" data-edit="${t.id}" aria-label="Edit" title="Edit">✎</button>
    </div>`).join("")}
  </div>` : "";

  const wkTasks = MONSUN.reduce((n,d,i) => n + assignedTo(ymd(addDays(mon,i))).length, 0);
  return `<div class="h2"><h2>Your week</h2>
    <span class="sub">${wkTasks ? wkTasks+" task"+(wkTasks===1?"":"s")+" assigned across the week"
      : "nothing assigned yet — give your backlog days below"}</span></div>
  <div class="wk">${days}</div>
  ${schedule}
  <div class="legend" style="margin:16px 0 22px">
    ${DOMAINS.map(d => `<span><i style="background:var(${d.v})"></i>${d.name}</span>`).join("")}</div>

  <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card"><div class="ch"><h3>Where the week is going</h3></div>
      <div class="grid" style="gap:13px">${domBars}</div></div>
    <div class="card"><div class="ch"><h3>Track by track</h3><span class="sp"></span>
      <span class="lab">logged / target</span></div>${trackRows}</div>
  </div>`;
}

/* ═══ BACKLOG ════════════════════════════════════════════════════════════ */
function taskRow(t){
  if (S.editing === t.id) return taskEditor(t);
  const b = bucket(t);
  const day = t.due
    ? (t.due === ymd(new Date()) ? "Today"
      : t.due === ymd(addDays(new Date(),1)) ? "Tomorrow"
      : DAYSHORT[parseYmd(t.due).getDay()] + " " + parseYmd(t.due).getDate())
    : "";
  return `<div class="item ${t.done?"done":""}" style="--c:var(${tv(t.k)})">
    <button class="box" data-task="${t.id}" aria-pressed="${!!t.done}" style="--c:var(${tv(t.k)})"
      aria-label="Done: ${esc(t.t)}">✓</button>
    <div class="sp"><div class="tt">${esc(t.t)}</div>
      <div class="mt"><span>${esc(track(t.k).name)}</span>
        ${t.est?`<span class="mono">${hm(t.est)}</span>`:""}
        ${day?`<span class="${b==="late"?"tag late":"mono"}">${b==="late"?"late · ":""}${day}</span>`
             :`<span class="dim">no day</span>`}
        <span>${PRIO[t.p]||""}</span>
        ${t.rep?`<span class="tag rep">↻ ${esc(repeatLabel(t))}</span>`:""}</div></div>
    <button class="pencil" data-edit="${t.id}" aria-label="Edit ${esc(t.t)}" title="Edit">✎</button>
    <button class="x" data-del="${t.id}" aria-label="Delete">×</button></div>`;
}

function taskEditor(t){
  return `<div class="item edit" style="--c:var(${tv(t.k)})">
    <div class="sp">
      <input type="text" id="ei-${t.id}" value="${esc(t.t)}" style="width:100%;font-weight:700"
        aria-label="Task">
      <div class="erow">
        <select id="ec-${t.id}" aria-label="Track">${trackOpts(t.k)}</select>
        <input id="ez-${t.id}" class="mono" type="number" min="0" step="15" value="${t.est||""}"
          placeholder="min" aria-label="Minutes">
        <div class="row" style="gap:5px">${[1,2,3].map(n =>
          `<button class="chipday ${n===t.p?"on":""}" data-ep="${t.id}:${n}">${PRIO[n]}</button>`).join("")}</div>
      </div>
      <div class="row" style="gap:5px;margin-top:10px">
        <span class="lab" style="margin-right:2px">Day</span>
        ${dayChips(t.due, "ed", t.id)}
        <input type="date" id="ex-${t.id}" value="${esc(t.due||"")}" aria-label="Or pick any date"
          style="padding:5px 8px">
      </div>
      <div class="row" style="gap:5px;margin-top:9px">
        <span class="lab" style="margin-right:2px">Repeats</span>
        ${Object.keys(REPEATS).map(r => `<button class="chipday ${(t.rep||"")===r?"on":""}"
          data-er="${t.id}:${r}">${REPEATS[r]}</button>`).join("")}
        ${t.rep === "weekly" && t.due
          ? `<span class="dim" style="font-size:12px">every ${DAYNAME[parseYmd(t.due).getDay()]}</span>` : ""}
      </div>
      <div class="row" style="margin-top:12px">
        <button class="btn solid sm" data-save="${t.id}">Save</button>
        <button class="btn quiet sm" data-cancel="1">Cancel</button>
        <span class="sp"></span>
        <button class="btn quiet sm" data-del="${t.id}" style="color:var(--late)">Delete</button>
      </div>
    </div></div>`;
}

function dumpCard(){
  const P = S.dump.proposals;
  return `<div class="card dump">
    <div class="ch"><h3>Brain dump</h3><span class="sp"></span>
      <span class="lab">get it out of your head</span></div>
    <textarea id="dump" rows="5" aria-label="Brain dump"
      placeholder="Just write. Everything you are carrying — a paragraph, a list, half-sentences. It gets broken into tasks you can schedule.">${esc(S.dump.text)}</textarea>
    <div class="row" style="margin-top:12px">
      <button class="btn solid" id="dbreak" ${S.dump.busy?"disabled":""}>${
        S.dump.busy?"Breaking it down…":"Break it into tasks"}</button>
      ${S.dump.text?`<button class="btn quiet sm" id="dclear">Clear</button>`:""}
    </div>
    ${P.length ? `<div class="props">
      <div class="row" style="margin-bottom:12px">
        <span class="lab">${P.length} task${P.length===1?"":"s"} — edit, give each a day, then add</span>
        <span class="sp"></span>
        <button class="btn solid sm" id="paddall">Add all to backlog</button>
      </div>
      <div class="row" style="margin-bottom:14px;gap:6px">
        <span class="dim" style="font-size:12px">Put them all on</span>
        ${dayChips("__none__", "pall", "x")}
      </div>
      ${P.map((x,i) => `<div class="prop" style="--c:var(${tv(x.k)})">
        <div>
          <input type="text" data-pt="${i}" value="${esc(x.t)}" aria-label="Task ${i+1}">
          <div class="pr2">
            <select data-pk="${i}" aria-label="Track">${trackOpts(x.k)}</select>
            <input class="mono" type="number" min="0" step="15" data-pz="${i}" value="${x.est||""}"
              placeholder="min" aria-label="Minutes">
          </div>
          <div class="days">${[1,2,3].map(n =>
            `<button class="chipday ${n===x.p?"on":""}" data-pp="${i}:${n}">${PRIO[n]}</button>`).join("")}</div>
          <div class="days">${dayChips(x.day, "pd", i)}</div>
        </div>
        <button class="x" data-px="${i}" aria-label="Remove">×</button>
      </div>`).join("")}
    </div>` : ""}
  </div>`;
}

function viewBacklog(){
  const groups = [["late","Late"],["today","Today"],["week","This week"],["later","Later"],["done","Done"]];
  const items = S.tasks.items.slice()
    .sort((a,b) => (a.p-b.p) || String(a.due||"9").localeCompare(String(b.due||"9")));
  const open = items.filter(t => !t.done).reduce((s,t) => s+(t.est||0), 0);
  const noday = items.filter(t => !t.done && !t.due).length;

  const body = groups.map(([g,label]) => {
    const l = items.filter(t => bucket(t) === g);
    if (!l.length) return "";
    return `<div style="margin-top:22px">
      <div class="row" style="margin-bottom:10px"><span class="lab">${label}</span>
        <span class="dim mono" style="font-size:11px">${l.length} · ${hm(l.reduce((s,t)=>s+(t.est||0),0))}</span></div>
      <div class="list">${l.map(taskRow).join("")}</div></div>`;
  }).join("");

  return `<div class="h2"><h2>Backlog</h2>
    <span class="sub">${open ? hm(open)+" open · about "+(open/360).toFixed(1)+" evenings" : "nothing open"}${
      noday ? " · "+noday+" with no day" : ""}</span></div>

  ${dumpCard()}

  <div class="card" style="margin-top:16px">
    <div class="addbar">
      <input id="nt" placeholder="Or add one straight away" aria-label="Task">
      <select id="nk" aria-label="Track">${trackOpts()}</select>
      <input id="nd" type="date" aria-label="Day">
      <input id="ne" type="number" min="0" step="15" placeholder="min" class="mono" aria-label="Minutes">
      <button class="btn solid" id="nadd">Add</button></div>
    <div class="row" style="margin-top:11px"><span class="dim" style="font-size:12px">Priority</span>
      ${[1,2,3].map(n=>`<button class="chipday ${n===S.prio?"on":""}" data-prio="${n}">${PRIO[n]}</button>`).join("")}</div>
  </div>
  ${body || `<div class="empty" style="margin-top:22px">Backlog is empty.</div>`}`;
}

/* turn free text into proposed tasks — Claude when available, lines otherwise */
function splitLines(text){
  return text.split(/\n+|(?:[.;]\s+(?=[A-Z]))/).map(x => x.replace(/^[\s\-•*\d.)]+/,"").trim())
    .filter(x => x.length > 2)
    .map(t => ({ t: t.length > 90 ? t.slice(0,87)+"…" : t, k:"rest", est:30, p:2, day:"" }));
}

function cleanProposals(arr){
  const ids = S.cfg.tracks.map(t => t.id);
  return (Array.isArray(arr) ? arr : []).slice(0,40).map(x => ({
    t: String(x && x.t || "").slice(0,120).trim(),
    k: ids.includes(x && x.k) ? x.k : "rest",
    est: Math.max(0, Math.min(600, Math.round(+(x && x.est) || 30))),
    p: [1,2,3].includes(+(x && x.p)) ? +x.p : 2,
    day: /^\d{4}-\d{2}-\d{2}$/.test(x && x.day) ? x.day : "",
  })).filter(x => x.t);
}

async function breakDown(){
  const text = S.dump.text.trim();
  if (!text) return toast("Write the dump first.");
  S.dump.busy = true; render();
  const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
  if (!sample) {
    S.dump.proposals = splitLines(text); S.dump.busy = false; render();
    return toast("Split by line — edit anything that came out wrong.");
  }
  const days = Array.from({length:7}, (_,i) => {
    const d = addDays(new Date(), i);
    return ymd(d) + " (" + DAYNAME[d.getDay()] + ")";
  });
  try {
    const out = await sample.json(
      "Turn this brain dump into a concrete task list.\n\n" +
      "Track ids you may use: " + S.cfg.tracks.map(t => t.id+" = "+t.name).join("; ") + ".\n" +
      "Days available: " + days.join(", ") + ". Sunday is a rest day — never assign work to it. " +
      "Any billing work happens on Mondays only — give billing tasks a Monday or no day at all.\n\n" +
      "Return ONLY a JSON array. Each element: {\"t\": an actionable title starting with a verb, " +
      "under 80 characters; \"k\": one track id from the list; \"est\": realistic minutes as a multiple " +
      "of 15; \"p\": 1 for must, 2 for should, 3 for someday; \"day\": a YYYY-MM-DD from the list, or \"\" }.\n\n" +
      "Rules: split anything over 2 hours into separate tasks. Do not invent work that is not in the dump. " +
      "Do not merge unrelated items. Assign a day only where the dump implies a deadline or an obvious " +
      "order, otherwise \"\". Spread assigned days out; never put more than 3 hours of tasks on one day.\n\n" +
      "Dump:\n" + text,
      { modelTier:"default" });
    const props = cleanProposals(out);
    S.dump.proposals = props.length ? props : splitLines(text);
    if (!props.length) toast("Fell back to splitting by line.");
  } catch (e) {
    S.dump.proposals = splitLines(text);
    toast(e && e.code === "rate_limited" ? "Too many requests — split by line instead."
      : "Split by line — edit anything that came out wrong.");
  }
  S.dump.busy = false; render();
}

/* ═══ REPORT (with the week's log folded in) ══════════════════════════════ */
function reportData(){
  const mon = mondayOf(addDays(new Date(), -7*S.offset));
  const days = Array.from({length:7}, (_,i) => ymd(addDays(mon,i)));
  const today = ymd(new Date()), elapsed = days.filter(d => d <= today);
  const logged = {}, plan = {};
  S.week.entries.forEach(e => logged[e.track] = (logged[e.track]||0)+e.min);
  days.forEach((d,i) => (S.cfg.rhythm[MONSUN[i]]||[]).forEach(b => plan[b.track] = (plan[b.track]||0)+dur(b)));
  // what you planned this week = the estimates on the tasks you gave these days
  S.tasks.items.forEach(t => { if (days.includes(t.due) || (t.done && days.includes(t.doneAt)))
    plan[t.k] = (plan[t.k]||0) + (t.est||0); });

  const rows = S.cfg.tracks.map(t => ({ id:t.id, name:t.name, dom:t.dom,
    logged:logged[t.id]||0, planned:plan[t.id]||0, target:t.target*60 }))
    .sort((a,b) => b.logged-a.logged || b.planned-a.planned);

  // plan adherence is now "did the tasks you assigned to a day actually happen"
  let due = 0, hit = 0;
  elapsed.forEach((d,i) => {
    const rec = S.week.days[d] || { blocks:{} };
    (S.cfg.rhythm[MONSUN[i]]||[]).forEach((b,bi) => { due++; if (rec.blocks[bi] === "done") hit++; });
    S.tasks.items.forEach(t => {
      if (t.due === d || (t.done && t.doneAt === d)) { due++; if (t.done && t.doneAt === d) hit++; }
    });
  });

  const habitRows = S.cfg.habits.map(h => {
    const cells = days.map(d => ({ d, due:h.days.includes(parseYmd(d).getDay()),
      on:isChecked(h.id,d), soon:d > today }));
    return { h, cells, due:cells.filter(c => c.due && !c.soon).length,
             hit:cells.filter(c => c.due && c.on).length };
  });

  return { days, elapsed, rows, blocksDue:due, blocksDone:hit, habitRows,
    total:rows.reduce((s,r) => s+r.logged, 0),
    energy:elapsed.map(d => (S.week.days[d]||{}).energy||0).filter(Boolean),
    tasksDone:S.tasks.items.filter(t => t.done && days.includes(t.doneAt)).length,
    late:S.tasks.items.filter(t => bucket(t) === "late").length, today };
}

function narrate(R){
  const real = R.rows.filter(r => r.logged > 0);
  if (!real.length) return "Nothing logged this week yet. Tick a block on Today, or add one entry by hand.";
  const top = real[0];
  const starved = R.rows.filter(r => r.target > 0 && r.logged < r.target*.34)
    .sort((a,b) => (b.target-b.logged)-(a.target-a.logged)).slice(0,2);
  const faith = R.habitRows.filter(x => x.h.track === "faith");
  const fd = faith.reduce((s,x) => s+x.due, 0), fh = faith.reduce((s,x) => s+x.hit, 0);
  const adh = R.blocksDue ? Math.round(R.blocksDone/R.blocksDue*100) : 0;
  const avg = R.energy.length ? R.energy.reduce((a,b) => a+b, 0)/R.energy.length : 0;
  const out = [];
  out.push(`You logged <b>${hm(R.total)}</b>, and <b>${esc(top.name)}</b> took the biggest share at ${hm(top.logged)}.`);
  out.push(`You kept <b>${adh}%</b> of the blocks you planned${adh>=70?" — a working week, not a lucky one."
    :adh>=40?", so the plan is roughly right but the evenings are losing.":". The plan is fiction right now; cut it rather than try harder."}`);
  if (fd) out.push(`On what you said matters most: <b>${fh} of ${fd}</b> faith checks. ${fh/fd>=.7?"Hold that.":"Move it earlier, before the day can take it."}`);
  if (starved.length) out.push(`<b>${starved.map(s=>esc(s.name)).join("</b> and <b>")}</b> got almost nothing — ${starved.length>1?"pick one and give it":"give it"} a named block next week.`);
  if (R.late) out.push(`<b>${R.late}</b> ${R.late===1?"task is":"tasks are"} late. Reschedule on purpose or delete.`);
  if (avg) out.push(`Average energy <b>${avg.toFixed(1)}/5</b>${avg<3?" — watch this before pushing harder on anything.":"."}`);
  return out.join(" ");
}

/* ═══ RENDER ═════════════════════════════════════════════════════════════ */
const TABS = [["today","Today"],["week","Week"],["backlog","Backlog"],["report","Report"]];
const VIEWS = { today:viewToday, week:viewWeek, backlog:viewBacklog, report:viewReport, setup:viewSetup };

function render(){
  $("#tabs").innerHTML = TABS.map(([id,l]) =>
    `<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${l}</button>`).join("");
  $$("#tabs .tab").forEach(b => b.onclick = () => { S.tab = b.dataset.tab; S.narrative = ""; render(); });
  const g = $("#gear");
  g.setAttribute("aria-selected", S.tab === "setup");
  g.onclick = () => { S.tab = S.tab === "setup" ? "today" : "setup"; render(); };

  const d = new Date();
  $("#stamp").textContent = d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})
    + (Store.mode === "db" ? "" : " · local");

  const v = $("#view");
  v.innerHTML = (VIEWS[S.tab] || viewToday)();
  wire(v); bindTips(v);
}

function wire(root){
  const date = ymd(new Date());

  $$("[data-blk]", root).forEach(b => b.onclick = () => {
    const i = +b.dataset.blk, act = b.dataset.act, rec = dayRec(date);
    const blocks = S.cfg.rhythm[new Date().getDay()] || [], was = rec.blocks[i];
    if (was === act) delete rec.blocks[i]; else rec.blocks[i] = act;
    if (act === "done" && was !== "done" && blocks[i]) {
      addEntry(blocks[i].track, dur(blocks[i]), blocks[i].label, date);
      toast("Logged " + hm(dur(blocks[i])));
    }
    saveWeek(); render();
  });
  $$("[data-habit]", root).forEach(b => b.onclick = () => { toggleHabit(b.dataset.habit, date); render(); });
  $$("[data-energy]", root).forEach(b => b.onclick = () => {
    const rec = dayRec(date), n = +b.dataset.energy;
    rec.energy = rec.energy === n ? 0 : n; saveWeek(); render();
  });
  const one = $("#one", root);
  if (one) one.onchange = () => { dayRec(date).one = one.value.trim(); saveWeek(); toast("Saved"); };
  const note = $("#note", root);
  if (note) note.onchange = () => { dayRec(date).note = note.value.trim(); saveWeek(); toast("Saved"); };

  $$("[data-bible]", root).forEach(b => b.onclick = () => {
    const n = +b.dataset.bible;
    S.cfg.bible.day = Math.max(0, Math.min(S.cfg.bible.total, S.cfg.bible.day + n));
    if (n > 0) { checkOn("bible", date); checkOn("quiet", date); }
    saveCfg(); render();
  });
  const bday = $("#bday", root);
  if (bday) bday.onchange = () => {
    S.cfg.bible.day = Math.max(0, Math.min(S.cfg.bible.total, +bday.value||0)); saveCfg(); render();
  };

  const ts = $("#tstart", root);
  if (ts) ts.onclick = () => {
    const k = $("#tsel", root).value;
    S.timer = { track:k, label:track(k).name, startedAt:Date.now() }; saveTimer(); render();
  };
  const tp = $("#tstop", root);
  if (tp) tp.onclick = () => {
    const m = Math.max(1, Math.round((Date.now()-S.timer.startedAt)/60000));
    addEntry(S.timer.track, m, S.timer.label, date);
    toast("Logged " + hm(m) + " to " + track(S.timer.track).name);
    S.timer = null; saveTimer(); render();
  };
  const tc = $("#tcancel", root);
  if (tc) tc.onclick = () => { S.timer = null; saveTimer(); render(); };
  $$("[data-quick]", root).forEach(b => b.onclick = () => {
    const k = $("#tsel", root).value, m = +b.dataset.quick;
    addEntry(k, m, track(k).name, date); toast("Logged " + hm(m)); render();
  });

  $$("[data-task]", root).forEach(b => b.onclick = () => {
    const t = S.tasks.items.find(x => x.id === b.dataset.task);
    if (!t) return;
    if (t.done) { uncompleteTask(t); saveTasks(); render(); return; }
    const nextDue = completeTask(t, date);
    saveTasks(); render();
    toast(t.est ? "Done — logged " + hm(t.est) + (nextDue ? ", next on " +
      parseYmd(nextDue).toLocaleDateString(undefined,{month:"short",day:"numeric"}) : "")
      : "Done. Off your head.");
  });
  $$("[data-del]", root).forEach(b => b.onclick = () => {
    S.tasks.items = S.tasks.items.filter(x => x.id !== b.dataset.del); saveTasks(); render();
  });
  $$("[data-prio]", root).forEach(b => b.onclick = () => { S.prio = +b.dataset.prio; render(); });

  /* ── editing one task ───────────────────────────────────────────────── */
  const cut = v => { const i = v.indexOf(":"); return [v.slice(0,i), v.slice(i+1)]; };
  const findTask = id => S.tasks.items.find(x => x.id === id);

  $$("[data-edit]", root).forEach(b => b.onclick = () => {
    S.editing = S.editing === b.dataset.edit ? null : b.dataset.edit;
    if (S.editing && S.tab !== "backlog") S.tab = "backlog";
    render();
  });
  $$("[data-cancel]", root).forEach(b => b.onclick = () => { S.editing = null; render(); });
  $$("[data-er]", root).forEach(b => b.onclick = () => {
    const [id,r] = cut(b.dataset.er), t = findTask(id);
    if (!t) return;
    t.rep = r;
    if (r && !t.due) t.due = ymd(new Date());
    saveTasks(); render();
    toast(r ? "Repeats " + repeatLabel(t) : "No longer repeats");
  });
  /* put the whole dump on one day in a single tap */
  $$("[data-pall]", root).forEach(b => b.onclick = () => {
    const day = cut(b.dataset.pall)[1];
    S.dump.proposals.forEach(pr => {
      pr.day = (day && isBilling({ label:pr.t }) && parseYmd(day).getDay() !== 1)
        ? ymd(nextMonday()) : day;
    });
    saveDump(); render();
    toast(day ? "All set to " + parseYmd(day).toLocaleDateString(undefined,
      { weekday:"long", month:"short", day:"numeric" }) : "Days cleared");
  });
  const pl = $("#pullate", root);
  if (pl) pl.onclick = () => {
    const late = S.tasks.items.filter(t => bucket(t) === "late");
    late.forEach(t => { t.due = isBilling({ label:t.t }) ? ymd(nextMonday()) : date; });
    saveTasks(); render(); toast(late.length + " pulled into today");
  };
  const gd = $("#gotodump", root);
  if (gd) gd.onclick = () => { S.tab = "backlog"; render();
    setTimeout(() => { const d = $("#dump"); if (d) d.focus(); }, 40); };
  $$("[data-ep]", root).forEach(b => b.onclick = () => {
    const [id,n] = cut(b.dataset.ep), t = findTask(id);
    if (t) { t.p = +n; saveTasks(); render(); }
  });
  /* one tap assigns a day — used by the editor and by "Give these a day" */
  $$("[data-ed]", root).forEach(b => b.onclick = () => {
    const [id,day] = cut(b.dataset.ed), t = findTask(id);
    if (!t) return;
    if (day && isBilling({ label:t.t }) && parseYmd(day).getDay() !== 1) {
      t.due = ymd(nextMonday()); saveTasks(); render();
      return toast("Billing is Mondays — moved to " + parseYmd(t.due)
        .toLocaleDateString(undefined,{ month:"short", day:"numeric" }));
    }
    t.due = day; saveTasks(); render();
    toast(day ? "Scheduled for " + parseYmd(day).toLocaleDateString(undefined,
      { weekday:"long", month:"short", day:"numeric" }) : "Day cleared");
  });
  $$("[data-save]", root).forEach(b => b.onclick = () => {
    const id = b.dataset.save, t = findTask(id);
    if (!t) return;
    const title = ($("#ei-"+id, root).value || "").trim();
    if (!title) return $("#ei-"+id, root).focus();
    t.t = title;
    t.k = $("#ec-"+id, root).value;
    t.est = +$("#ez-"+id, root).value || 0;
    const d = $("#ex-"+id, root).value;
    if (d !== t.due) t.due = d;
    S.editing = null; saveTasks(); render(); toast("Saved");
  });
  $$("[id^='ex-']", root).forEach(i => i.onchange = () => {
    const t = findTask(i.id.slice(3));
    if (t) { t.due = i.value; saveTasks(); render(); }
  });

  /* ── brain dump ─────────────────────────────────────────────────────── */
  const dp = $("#dump", root);
  if (dp) dp.oninput = () => { S.dump.text = dp.value; saveDump(); };  // no re-render: keep the caret
  const db = $("#dbreak", root);
  if (db) db.onclick = () => { S.dump.text = ($("#dump", root) || {}).value || S.dump.text; breakDown(); };
  const dc = $("#dclear", root);
  if (dc) dc.onclick = () => { S.dump = { text:"", proposals:[], busy:false }; saveDump(); render(); };

  $$("[data-pt]", root).forEach(i => i.onchange = () => { S.dump.proposals[+i.dataset.pt].t = i.value.trim(); saveDump(); });
  $$("[data-pk]", root).forEach(i => i.onchange = () => { S.dump.proposals[+i.dataset.pk].k = i.value; saveDump(); render(); });
  $$("[data-pz]", root).forEach(i => i.onchange = () => { S.dump.proposals[+i.dataset.pz].est = +i.value || 0; saveDump(); });
  $$("[data-pp]", root).forEach(b => b.onclick = () => {
    const [i,n] = cut(b.dataset.pp); S.dump.proposals[+i].p = +n; saveDump(); render();
  });
  $$("[data-pd]", root).forEach(b => b.onclick = () => {
    const [i,day] = cut(b.dataset.pd), pr = S.dump.proposals[+i];
    if (day && isBilling({ label:pr.t }) && parseYmd(day).getDay() !== 1) {
      pr.day = ymd(nextMonday()); render(); return toast("Billing is Mondays.");
    }
    pr.day = day; saveDump(); render();
  });
  $$("[data-px]", root).forEach(b => b.onclick = () => {
    S.dump.proposals.splice(+b.dataset.px, 1); saveDump(); render();
  });
  const pa = $("#paddall", root);
  if (pa) pa.onclick = () => {
    const add = S.dump.proposals.filter(x => x.t.trim());
    if (!add.length) return toast("Nothing to add.");
    add.forEach(x => S.tasks.items.push({ id:Math.random().toString(36).slice(2,9),
      t:x.t.trim(), k:x.k, due:x.day || "", est:x.est || 0, p:x.p, rep:"", done:false }));
    S.dump = { text:"", proposals:[], busy:false }; saveDump();
    saveTasks(); render();
    toast(add.length + " task" + (add.length===1?"":"s") + " added");
  };
  const nadd = $("#nadd", root);
  if (nadd) {
    const add = () => {
      const t = $("#nt", root).value.trim();
      if (!t) return $("#nt", root).focus();
      S.tasks.items.push({ id:Math.random().toString(36).slice(2,9), t, k:$("#nk",root).value,
        due:$("#nd",root).value||"", est:+$("#ne",root).value||0, p:S.prio, rep:"", done:false });
      saveTasks(); render();
    };
    nadd.onclick = add;
    $("#nt", root).onkeydown = e => { if (e.key === "Enter") add(); };
  }

  const ea = $("#eadd", root);
  if (ea) ea.onclick = () => {
    const m = +$("#em", root).value;
    if (!(m > 0)) return $("#em", root).focus();
    addEntry($("#ek",root).value, m, $("#et",root).value.trim()||null, $("#ed",root).value);
    toast("Logged " + hm(m)); render();
  };
  $$("[data-delentry]", root).forEach(b => b.onclick = () => {
    S.week.entries = S.week.entries.filter(e => e.id !== b.dataset.delentry); saveWeek(); render();
  });

  const pw = $("#prevw", root);
  if (pw) pw.onclick = async () => { S.offset++; S.narrative = "";
    await loadWeek(weekKey(addDays(new Date(), -7*S.offset))); render(); };
  const nw = $("#nextw", root);
  if (nw) nw.onclick = async () => { if (!S.offset) return; S.offset--; S.narrative = "";
    await loadWeek(weekKey(addDays(new Date(), -7*S.offset))); render(); };
  const tb = $("#tbl", root);
  if (tb) tb.onclick = () => { S.showTable = !S.showTable; render(); };
  const rf = $("#reflect", root);
  if (rf) rf.onclick = () => askReflection(rf);

  $$("[data-target]", root).forEach(i => i.onchange = () => {
    track(i.dataset.target).target = Math.max(0, +i.value||0); saveCfg(); toast("Target updated");
  });
  const bs = $("#bstart", root);
  if (bs) bs.onchange = () => { S.cfg.bible.start = bs.value; saveCfg(); };
  const bt = $("#btotal", root);
  if (bt) bt.onchange = () => { S.cfg.bible.total = Math.max(1, +bt.value||365); saveCfg(); };
  const rs = $("#rsave", root);
  if (rs) rs.onclick = () => {
    try {
      const p = JSON.parse($("#rhy", root).value);
      for (const k of Object.keys(p)) {
        if (!/^[0-6]$/.test(k)) throw new Error("day keys must be 0–6, got “"+k+"”");
        if (!Array.isArray(p[k])) throw new Error("day "+k+" must be a list of blocks");
        p[k].forEach(b => { if (!/^\d{2}:\d{2}$/.test(b.start||"") || !/^\d{2}:\d{2}$/.test(b.end||""))
          throw new Error("every block needs start and end as HH:MM"); });
      }
      S.cfg.rhythm = p; saveCfg(); toast("Rhythm saved"); render();
    } catch (e) { $("#rmsg", root).innerHTML = '<span style="color:var(--late)">'+esc(e.message)+"</span>"; }
  };
  const vs = $("#vsave", root);
  if (vs) vs.onclick = () => {
    try {
      const v = JSON.parse($("#vrs", root).value);
      if (!Array.isArray(v) || !v.length) throw new Error("needs to be a non-empty list");
      v.forEach((x,i) => { if (!Array.isArray(x) || x.length < 2 || !String(x[1]).trim())
        throw new Error("item " + (i+1) + " must be [\u201creference\u201d, \u201ctext\u201d]"); });
      S.cfg.verses = v.map(x => [String(x[0]), String(x[1])]);
      saveCfg(); $("#vmsg", root).textContent = ""; toast("Verses saved"); render();
    } catch (e) { $("#vmsg", root).innerHTML = '<span style="color:var(--late)">'+esc(e.message)+"</span>"; }
  };
  const vr = $("#vreset", root);
  if (vr) vr.onclick = () => { delete S.cfg.verses; saveCfg(); render(); toast("Back to the KJV set"); };

  const rb = $("#rback", root);
  if (rb) rb.onclick = () => {
    S.cfg.rhythm = S.cfg.rhythmArchive; delete S.cfg.rhythmArchive;
    saveCfg(); render(); toast("Old week restored");
  };
  const rr = $("#rreset", root);
  if (rr) rr.onclick = () => {
    S.cfg.rhythm = JSON.parse(JSON.stringify(SEED_RHYTHM)); saveCfg(); render(); toast("Back to the starting plan");
  };
  const ex = $("#exp", root);
  if (ex) ex.onclick = doExport;
  const im = $("#imp", root);
  if (im) im.onclick = () => $("#impf", root).click();
  const imf = $("#impf", root);
  if (imf) imf.onchange = () => doImport(imf.files[0]);
}

/* ── reflection ────────────────────────────────────────────────────────── */
async function askReflection(btn){
  btn.disabled = true; btn.textContent = "thinking…";
  const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
  if (!sample) { btn.disabled = false; btn.textContent = "ask for a reflection";
    return toast("Reflections need the hosted version."); }
  const R = reportData();
  const facts = {
    hoursLogged:+(R.total/60).toFixed(1),
    blocksKept:R.blocksDue ? Math.round(R.blocksDone/R.blocksDue*100)+"%" : "n/a",
    byTrack:S.cfg.tracks.map(t => R.rows.find(r => r.id === t.id)).filter(r => r && (r.logged||r.target))
      .map(r => ({ track:r.name, logged:+(r.logged/60).toFixed(1), target:r.target/60 })),
    habits:R.habitRows.map(x => ({ habit:x.h.name, hit:x.hit, due:x.due })),
    tasksFinished:R.tasksDone, tasksLate:R.late,
    energyByDay:R.elapsed.map(d => (S.week.days[d]||{}).energy||null),
    notes:R.elapsed.map(d => (S.week.days[d]||{}).note).filter(Boolean),
  };
  try {
    const out = await sample(
      "Below is one week from a personal time tracker. Each track has hours logged against a weekly target " +
      "the owner set themselves; habits show hits against the days they were due. The owner is carrying more " +
      "tracks than one week holds, and the tracks are listed in the owner's own priority order.\n\n" +
      "Write 3-5 sentences, second person, plain and warm but not soft. Name what the data actually shows, " +
      "name the single thing to cut or move next week, and end with one concrete sentence to act on Monday. " +
      "No lists, no headings, no preamble, no praise for logging. Use only the numbers given; invent nothing.\n\n"
      + JSON.stringify(facts),
      { modelTier:"default", onText: ({ text }) => {
          S.narrative = text;
          const box = $("#narrbox");
          if (box) { let p = $("#live");
            if (!p) { p = document.createElement("p"); p.id = "live"; box.appendChild(p); }
            p.textContent = text; }
        } });
    S.narrative = out.text; render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "ask for a reflection";
    toast(e && e.code === "not_granted" ? "Reflections are off for this page."
      : e && e.code === "rate_limited" ? "Too many requests — try in a minute."
      : "Could not get a reflection just now.");
  }
}

/* ── export / import ───────────────────────────────────────────────────── */
async function doExport(){
  const weeks = {};
  for (let i = 0; i < 26; i++) {
    const k = weekKey(addDays(new Date(), -7*i));
    const w = await Store.get("logs/"+k);
    if (w) weeks[k] = w;
  }
  const json = JSON.stringify({ app:"first-things-first", exported:new Date().toISOString(),
    config:S.cfg, tasks:S.tasks, checks:S.checks, weeks }, null, 2);
  const name = "first-things-first-"+ymd(new Date())+".json";
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (dl) { try { await dl.save({ filename:name, data:json }); return toast("Exported"); } catch (_) {} }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type:"application/json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href); toast("Exported");
}

function doImport(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const b = JSON.parse(fr.result);
      if (b.config) { S.cfg = b.config; await Store.set("app/config", S.cfg); }
      if (b.tasks)  { S.tasks = b.tasks; await Store.set("app/tasks", S.tasks); }
      if (b.checks) { S.checks = b.checks; await Store.set("app/checks", S.checks); }
      if (b.weeks) for (const k of Object.keys(b.weeks)) await Store.set("logs/"+k, b.weeks[k]);
      await loadWeek(weekKey(new Date())); render(); toast("Backup restored");
    } catch (_) { toast("That is not a First Things First backup."); }
  };
  fr.readAsText(file);
}

/* ── migrations ────────────────────────────────────────────────────────── */
const isBilling = b => /billing/i.test(b && b.label || "");
const nextMonday = () => { const d = new Date(); return addDays(d, (8 - d.getDay()) % 7 || 7); };

/* v3 — the prescribed week is gone: tasks you assign carry the plan. The old
   rhythm is archived rather than deleted, and Setup can put it back. */
function migrate(){
  const from = S.cfg.v || 1;
  if (from >= CFG_VERSION) return;
  if (from < 3) {
    const had = Object.keys(S.cfg.rhythm || {}).some(k => (S.cfg.rhythm[k] || []).length);
    if (had) S.cfg.rhythmArchive = S.cfg.rhythm;
    S.cfg.rhythm = { 0:[], 1:[], 2:[], 3:[], 4:[], 5:[], 6:[] };
    const ct = S.cfg.tracks.find(t => t.id === "contract");
    if (ct && /Saturday/i.test(ct.next || "")) ct.next = "All of it Monday evening";
  }
  // billing still belongs to Mondays wherever it was scheduled
  S.tasks.items.forEach(t => {
    if (!t.done && isBilling({ label:t.t }) && t.due && parseYmd(t.due).getDay() !== 1) {
      const d = parseYmd(t.due);
      t.due = ymd(addDays(d, (8 - d.getDay()) % 7 || 7));
    }
  });
  S.cfg.v = CFG_VERSION;
  Store.set("app/config", S.cfg); Store.set("app/tasks", S.tasks);
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function boot(carried){
  if (carried && carried.tab) { S.tab = carried.tab; S.offset = carried.offset||0; }
  render();
  await Store.connect();

  S.cfg = await Store.get("app/config");
  if (!S.cfg || !Array.isArray(S.cfg.tracks)) { S.cfg = SEED_CONFIG(); await Store.set("app/config", S.cfg); }
  SEED_TRACKS.forEach(st => { if (!S.cfg.tracks.some(t => t.id === st.id)) S.cfg.tracks.push({ ...st }); });
  if (!S.cfg.habits) S.cfg.habits = SEED_HABITS.map(h => ({ ...h }));
  if (!S.cfg.bible)  S.cfg.bible  = SEED_CONFIG().bible;

  const tk = await Store.get("app/tasks");
  if (tk && Array.isArray(tk.items)) S.tasks = tk;

  const dmp = await Store.get("app/dump");
  if (dmp) S.dump = { text:dmp.text || "", proposals:Array.isArray(dmp.proposals)?dmp.proposals:[], busy:false };

  migrate();                       // needs both the config and the backlog in hand

  S.checks = (await Store.get("app/checks")) || {};
  const tm = await Store.get("app/timer");
  S.timer = tm && tm.startedAt ? tm : null;
  await loadWeek(weekKey(new Date()));
  render();

  setInterval(() => {
    const c = $("#clk");
    if (c && S.timer && S.timer.startedAt) {
      const el = Math.floor((Date.now()-S.timer.startedAt)/1000);
      c.textContent = pad(Math.floor(el/3600))+":"+pad(Math.floor(el/60)%60)+":"+pad(el%60);
    }
  }, 1000);
  setInterval(() => { if (S.tab === "today") render(); }, 120000);
}

if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ tab:S.tab, offset:S.offset }));
S.cfg = SEED_CONFIG();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
