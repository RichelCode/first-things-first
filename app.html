<title>First Things First</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,500..700,100,1&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700&family=DM+Mono:wght@400;500&display=swap">
<script src="seed.js"></script>
<style>
/* ── one committed visual world: blush, soft, bright ────────────────────── */
:root{
  color-scheme: light;                 /* keep native controls light in a dark OS */
  --ground:#FFF7F9; --ground-2:#FFEFF4;
  --surface:#FFFFFF; --surface-2:#FFF1F5; --surface-3:#FFE4EC;
  --border:#FBDCE5; --border-2:#F5C3D3;
  --ink:#43262F; --ink-2:#7C5A66; --ink-3:#AE8F9B;
  --pink:#E8497D; --pink-deep:#C9296A; --pink-wash:#FFE7EF;
  --coral:#FF8A6B;
  --d-faith:#7A43C9; --d-paid:#C07A0A; --d-build:#D62C72; --d-life:#0F8060;
  --ok:#0F8060; --late:#C0392B; --late-wash:#FFEAE6;
  --star:#E0A11B; --star-wash:#FFF4DC;
  --sh:0 1px 2px rgba(200,120,150,.10), 0 10px 30px -18px rgba(190,90,130,.42);
  --sh-lift:0 2px 4px rgba(200,120,150,.12), 0 18px 40px -20px rgba(190,90,130,.5);
  --r:18px; --r-2:12px; --r-3:9px;
  --sans:"Nunito Sans",ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
  --serif:"Fraunces",Georgia,serif;
  --mono:"DM Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.015em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:14.5px;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--border);border-radius:var(--r-3);padding:9px 11px;min-width:0}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:hover,select:hover,textarea:hover{border-color:var(--border-2)}
:focus-visible{outline:2.5px solid var(--pink);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-size:11px;font-weight:700;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)} .dim{color:var(--ink-3)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── header ─────────────────────────────────────────────────────────────── */
header{position:sticky;top:0;z-index:30;background:rgba(255,247,249,.9);backdrop-filter:blur(12px);
  border-bottom:1.5px solid var(--border)}
.hin{max-width:1140px;margin:0 auto;padding:16px 22px 12px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.brand{font-family:var(--serif);font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1;white-space:nowrap}
.brand em{font-style:normal;color:var(--pink)}
.today-lab{font-family:var(--mono);font-size:12px;color:var(--ink-2);letter-spacing:.01em}
.hin .sp{flex:1}
.tabs{display:flex;gap:5px;background:var(--ground-2);padding:4px;border-radius:999px;overflow-x:auto;
  scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{padding:7px 17px;border-radius:999px;font-weight:700;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.tab:hover{color:var(--pink-deep)}
.tab[aria-selected="true"]{background:var(--pink);color:#fff;box-shadow:0 2px 8px -2px rgba(232,73,125,.55)}
.gear{width:36px;height:36px;border-radius:50%;background:var(--surface);border:1.5px solid var(--border);
  display:grid;place-items:center;font-size:15px;color:var(--ink-2);flex:0 0 auto}
.gear:hover{border-color:var(--pink);color:var(--pink)}
.gear[aria-selected="true"]{background:var(--pink);border-color:var(--pink);color:#fff}

/* ── page ───────────────────────────────────────────────────────────────── */
main{max-width:1140px;margin:0 auto;padding-inline:22px;padding-block:26px 80px}
.h2{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.h2 h2{font-size:30px}
.h2 .sub{font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.h2 .sp{flex:1}

.card{background:var(--surface);border-radius:var(--r);padding:20px 22px;box-shadow:var(--sh)}
.card.tint{background:var(--surface-2);box-shadow:none}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.ch h3{font-size:17px} .ch .sp{flex:1}
.grid{display:grid;gap:16px}
.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
.two{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
@media (max-width:900px){.two{grid-template-columns:1fr}}

.btn{background:var(--surface-2);border-radius:999px;padding:9px 18px;font-weight:700;font-size:13.5px;
  color:var(--pink-deep)}
.btn:hover{background:var(--surface-3)}
.btn.solid{background:var(--pink);color:#fff;box-shadow:0 2px 10px -3px rgba(232,73,125,.6)}
.btn.solid:hover{background:var(--pink-deep)}
.btn.quiet{background:none;color:var(--ink-2)}
.btn.quiet:hover{background:var(--surface-2);color:var(--ink)}
.btn.sm{padding:6px 13px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;
  padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
.tag.late{background:var(--late-wash);color:var(--late)}
.tag.live{background:var(--pink);color:#fff}
.tag.rep{background:#EDE4FF;color:var(--d-faith)}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.empty{border-radius:var(--r-2);padding:20px;background:var(--surface-2);color:var(--ink-2);font-size:14px}

/* ── one thing ──────────────────────────────────────────────────────────── */
.one{background:linear-gradient(135deg,var(--pink-wash),var(--surface-2));border-radius:var(--r);
  padding:16px 20px 18px;box-shadow:var(--sh)}
.one input{width:100%;margin-top:8px;font-size:16px;font-weight:600;border-color:var(--border-2);
  background:var(--surface);border-radius:var(--r-2);padding:11px 13px}

/* ── checks ─────────────────────────────────────────────────────────────── */
.chk{display:flex;align-items:center;gap:12px;padding:6px 0}
.chk .nm{flex:1;font-size:14.5px;font-weight:600}
.chk .st{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.box{width:27px;height:27px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);
  display:grid;place-items:center;font-size:13px;line-height:1;color:transparent;flex:0 0 auto;padding:0}
.box:hover{border-color:var(--c,var(--pink))}
.box[aria-pressed="true"]{background:var(--c,var(--pink));border-color:var(--c,var(--pink));color:#fff}

/* ── timer ──────────────────────────────────────────────────────────────── */
.clk{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.clk.idle{color:var(--ink-3)}

/* ── meters ─────────────────────────────────────────────────────────────── */
.meter{height:9px;border-radius:999px;background:var(--ground-2);position:relative;overflow:hidden}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--c)}
.notch{position:absolute;top:-3px;bottom:-3px;width:2.5px;background:var(--ink-2);border-radius:2px;
  opacity:.65}

/* ── tasks & entries ────────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:7px}
.item{display:flex;gap:13px;align-items:center;background:var(--surface);border-radius:var(--r-2);
  padding:12px 14px;box-shadow:var(--sh);position:relative;overflow:hidden}
.item::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.item.done{background:var(--surface-2);box-shadow:none}
.item.done::before{opacity:.3}
.item.done .tt{color:var(--ink-3);text-decoration:line-through}
.item .tt{font-weight:700;font-size:14.5px;line-height:1.35}
.item .mt{font-size:11.5px;color:var(--ink-3);margin-top:2px;display:flex;gap:9px;flex-wrap:wrap;
  align-items:center}
.item .sp{flex:1;min-width:0}
.x{width:26px;height:26px;border-radius:50%;color:var(--ink-3);font-size:16px;line-height:1;flex:0 0 auto}
.x:hover{background:var(--late-wash);color:var(--late)}
.addbar{display:grid;grid-template-columns:minmax(0,1fr) 166px 74px auto;gap:9px}
@media (max-width:780px){.addbar{grid-template-columns:1fr 1fr}.addbar>*:first-child{grid-column:1/-1}}

/* ── report ─────────────────────────────────────────────────────────────── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{background:var(--surface);border-radius:var(--r-2);padding:15px 17px;box-shadow:var(--sh)}
.stat .k{font-size:28px;font-weight:700;letter-spacing:-.025em;line-height:1.05;
  font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--ink-3);margin-top:4px;font-weight:600}
.chart{display:flex;flex-direction:column;gap:9px}
.crow{display:grid;grid-template-columns:minmax(118px,192px) minmax(0,1fr) 86px;gap:14px;align-items:center}
@media (max-width:620px){.crow{grid-template-columns:1fr;gap:4px}.crow .v{text-align:left}}
.crow .l{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;min-width:0}
.crow .l span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctr{position:relative;height:20px;background:var(--ground-2);border-radius:999px}
.cbar{position:absolute;left:0;top:0;bottom:0;background:var(--c);border-radius:999px;min-width:3px;
  border-right:2px solid var(--surface)}
.cbar.zero{background:var(--border-2)}
.crow .v{font-family:var(--mono);font-size:12px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
.axis{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);
  border-top:1.5px solid var(--border);padding-top:6px;margin-top:4px}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.hm{display:grid;grid-template-columns:minmax(92px,148px) repeat(7,minmax(0,1fr)) 52px;gap:5px;align-items:center}
.hm .hd{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center}
.hm .rl{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell{height:24px;border-radius:7px;background:var(--surface-3)}
.cell.on{background:var(--c)}
.cell.soon{background:none;box-shadow:inset 0 0 0 1.5px var(--border)}
.hm .rn{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:right;
  font-variant-numeric:tabular-nums}
.narr{font-family:var(--serif);font-size:17px;line-height:1.65;max-width:62ch}
.narr p+p{margin-top:.75em;border-top:1.5px solid var(--border);padding-top:.75em}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th,table.data td{text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--border)}
table.data th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3)}
table.data td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}
.kv{display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:10px 14px;align-items:center;font-size:14px}
textarea.json{width:100%;font-family:var(--mono);font-size:12px;line-height:1.55;min-height:250px}

/* ── scripture banner ───────────────────────────────────────────────────── */
.verse{background:linear-gradient(120deg,var(--pink-wash),#F3E9FF 78%);border-radius:var(--r);
  padding:17px 22px 19px;box-shadow:var(--sh);margin-bottom:18px}
.verse .vt{font-family:var(--serif);font-size:18.5px;line-height:1.5;margin-top:7px;max-width:70ch;
  font-variation-settings:"SOFT" 100,"WONK" 1}
.verse .vr{font-size:12.5px;font-weight:700;color:var(--d-faith);margin-top:9px;letter-spacing:.02em}

/* ── the day's challenge ────────────────────────────────────────────────── */
.chal{display:flex;gap:22px;align-items:center;background:var(--surface);border-radius:var(--r);
  padding:18px 24px;box-shadow:var(--sh);margin-bottom:18px}
@media (max-width:560px){.chal{flex-direction:column;align-items:flex-start;gap:14px}}
.ring{position:relative;width:104px;height:104px;flex:0 0 auto}
.ring svg{width:104px;height:104px;transform:rotate(-90deg)}
.ring .tr{fill:none;stroke:var(--ground-2);stroke-width:9}
.ring .pg{fill:none;stroke:var(--pink);stroke-width:9;stroke-linecap:round;
  transition:stroke-dashoffset .6s cubic-bezier(.3,1.2,.4,1)}
.ring .rn{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
  justify-content:center;line-height:1}
.ring .rn b{font-size:30px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ring .rn span{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-top:4px}
.chal-b{flex:1;min-width:0}
.chal-h{font-family:var(--serif);font-size:21px;font-weight:600;margin-top:5px;letter-spacing:-.015em}
.chal-s{font-size:13.5px;color:var(--ink-2);margin-top:7px}
.pips{display:flex;gap:6px;margin-top:11px;max-width:330px}
.pip{height:8px;flex:1;border-radius:999px;background:var(--ground-2);position:relative;overflow:hidden}
.pip i{position:absolute;inset:0;border-radius:999px;background:var(--pink);transform-origin:left;
  transform:scaleX(var(--f,0));transition:transform .5s ease}
.pip.hit i{background:var(--star)}
.chal.won{background:linear-gradient(115deg,var(--star-wash),var(--pink-wash) 70%,#F1E7FF)}
.chal.won .pg{stroke:var(--star)}
.chal.won .ring .rn b{font-size:34px;color:var(--star)}
.chal.won .chal-h{font-size:25px}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:95}

/* ── task details ───────────────────────────────────────────────────────── */
.note{grid-column:1/-1;margin:10px 0 2px;padding:12px 14px;background:var(--surface-2);
  border-radius:var(--r-2);border-left:4px solid var(--c);font-size:13.5px;line-height:1.6;color:var(--ink-2)}
.note p{margin:0 0 6px}
.note p:last-child{margin-bottom:0}
.note ul{margin:0;padding-left:19px}
.note li{margin-bottom:5px}
.note li::marker{color:var(--c)}
.note strong{color:var(--ink);font-weight:700;background:var(--pink-wash);padding:0 3px;border-radius:3px}
.item.hasnote{flex-wrap:wrap}
.star{width:30px;height:30px;border-radius:50%;flex:0 0 auto;padding:0;display:grid;place-items:center;
  font-size:16px;line-height:1;color:var(--border-2)}
.star:hover{background:var(--star-wash);color:var(--star)}
.star.on{color:var(--star)}
.star.on:hover{color:var(--star)}
.item.starred{box-shadow:var(--sh-lift),inset 0 0 0 2px var(--star)}
.item.starred .tt{font-weight:700}
.starcount{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--star);
  background:var(--star-wash);border-radius:999px;padding:3px 10px;letter-spacing:.02em}
.starcount.full{color:#8A5D00}
.disc{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--pink-deep);background:var(--pink-wash);
  border-radius:999px;padding:2px 9px}
.disc:hover{background:var(--surface-3)}

/* ── inline task editor ─────────────────────────────────────────────────── */
.item.edit{align-items:stretch;box-shadow:var(--sh-lift)}
.erow{display:grid;grid-template-columns:minmax(0,1fr) 86px auto;gap:9px;align-items:center;margin-top:9px}
@media (max-width:640px){.erow{grid-template-columns:1fr 86px}.erow>*:last-child{grid-column:1/-1}}
.chipday{border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700;background:var(--surface-2);
  color:var(--ink-2)}
.chipday:hover{background:var(--surface-3);color:var(--pink-deep)}
.chipday.on{background:var(--pink);color:#fff}
.dstrip{display:inline-flex;gap:3px;background:var(--surface-2);padding:3px;border-radius:999px}
.dbtn{width:27px;height:27px;border-radius:50%;font-size:12px;font-weight:700;color:var(--ink-3);
  display:grid;place-items:center;padding:0}
.dbtn:hover{color:var(--pink-deep);background:var(--surface-3)}
.dbtn.on{background:var(--pink);color:#fff}
.chipday.rest{color:var(--ink-3);opacity:.7}
.chipday.rest::after{content:" ·rest";font-size:9.5px;letter-spacing:.04em}
.chipday.rest.on{background:var(--ink-3);color:#fff;opacity:1}
.pencil{width:28px;height:28px;border-radius:50%;color:var(--ink-3);font-size:13px;flex:0 0 auto;
  display:grid;place-items:center}
.pencil:hover{background:var(--surface-2);color:var(--pink-deep)}
.pencil.move{font-size:15px;font-weight:700}

/* ── brain dump ─────────────────────────────────────────────────────────── */
.dump textarea{width:100%;font-size:15px;line-height:1.6;min-height:120px;border-radius:var(--r-2);
  border-color:var(--border-2)}
.props{margin-top:18px;border-top:1.5px solid var(--border);padding-top:16px}
.prop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:start;
  background:var(--surface-2);border-radius:var(--r-2);padding:12px 14px;margin-bottom:8px;
  border-left:5px solid var(--c)}
.prop input[type=text]{width:100%;font-weight:700;background:var(--surface)}
.prop .pr2{display:grid;grid-template-columns:minmax(0,1fr) 82px;gap:8px;margin-top:8px}
.prop .days{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}

/* ── tasks inside the week grid ─────────────────────────────────────────── */
.wt{display:flex;gap:7px;align-items:flex-start;font-size:11.5px;line-height:1.35;
  background:var(--surface-2);border-radius:8px;padding:6px 8px;border-left:4px solid var(--c)}
.wt .tb{width:15px;height:15px;border-radius:50%;border:2px solid var(--border-2);background:var(--surface);
  flex:0 0 auto;padding:0;margin-top:1px}
.wt .tb:hover{border-color:var(--c)}
.wt.late{border-left-color:var(--late)}
.day .sect{font-size:9.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);
  margin-top:4px}

#tip{position:fixed;z-index:80;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;
  font-weight:600;padding:7px 11px;border-radius:9px;max-width:250px;opacity:0;transition:opacity .12s;
  box-shadow:var(--sh-lift)}
#tip.on{opacity:1}
#tip b{color:#FFC9DB}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:12px 20px;border-radius:999px;font-size:13.5px;font-weight:700;box-shadow:var(--sh-lift);z-index:90;
  opacity:0;transition:opacity .18s,transform .18s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-5px)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<header>
  <div class="hin">
    <span class="brand">First <em>Things</em> First</span>
    <span class="today-lab" id="stamp"></span>
    <span class="sp"></span>
    <div class="tabs" role="tablist" id="tabs"></div>
    <button class="gear" id="gear" role="tab" aria-label="Setup" title="Setup">⚙</button>
  </div>
</header>
<main id="view" role="tabpanel"></main>
<div id="tip" role="status" aria-live="off"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* ═══════════════════════════════════════════════════════════════════════════
   First Things First — you write today's list, tick it, and the report tells the truth.
   Four tabs. Four domains: God · Paid work · The PhD build · Life & body.
   ═══════════════════════════════════════════════════════════════════════════ */

const DOMAINS = [
  { id:"faith", name:"God",           v:"--d-faith" },
  { id:"paid",  name:"Paid work",     v:"--d-paid"  },
  { id:"build", name:"The PhD build", v:"--d-build" },
  { id:"life",  name:"Life & body",   v:"--d-life"  },
];

const SEED_TRACKS = [
  { id:"faith",     dom:"faith", name:"Prayer, Bible & church",    target:7,  next:"Catch the reading plan up" },

/* ── dates ─────────────────────────────────────────────────────────────── */
const DAYNAME  = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAYSHORT = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONSUN   = [1,2,3,4,5,6,0];
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseYmd = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const mondayOf = d => addDays(d, -((d.getDay()+6)%7));
const daysBetween = (a,b) => Math.round((parseYmd(b)-parseYmd(a))/86400000);
function weekKey(d){
  const t = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  t.setDate(t.getDate()+3-((t.getDay()+6)%7));
  const w1 = new Date(t.getFullYear(),0,4);
  return t.getFullYear()+"-W"+pad(1+Math.round(((t-w1)/86400000-3+((w1.getDay()+6)%7))/7));
}
const hm = m => { m = Math.round(m); if (m <= 0) return "0m";
  const h = Math.floor(m/60), r = m%60; return h&&r ? h+"h "+r+"m" : h ? h+"h" : r+"m"; };

/* ── storage ────────────────────────────────────────────────────────────
   Local-first. localStorage is written synchronously and is always the
   thing the UI reads back, so a tick can never be lost to a store that is
   slow, unavailable, or not granted. The shared store is a mirror: each
   document carries `_t`, and whichever copy is newer wins on load. */
const Store = {
  db:null, mode:"local",
  async connect(){
    try {
      const db = window.claude && window.claude.use ? await window.claude.use("db") : null;
      if (db) { this.db = db; this.mode = "sync"; }
    } catch (e) { lastError = "db connect: " + ((e && e.message) || e); }
    return this.mode;
  },
  lsGet(p){ try { const r = localStorage.getItem("ftf:"+p); return r ? JSON.parse(r) : null; }
    catch (e) { lastError = "local read: " + ((e && e.message) || e); return null; } },
  lsSet(p,o){ try { localStorage.setItem("ftf:"+p, JSON.stringify(o)); return true; }
    catch (e) { lastError = "local write: " + ((e && e.message) || e); return false; } },

  async get(p){
    const local = this.lsGet(p);
    if (!this.db) return local;
    let remote = null;
    try { const snap = await this.db.doc(p).get(); if (snap.exists) remote = snap.data(); }
    catch (e) { lastError = "store read " + p + ": " + ((e && e.code) || e.message || e); }
    if (!remote) return local;
    if (!local) { this.lsSet(p, remote); return remote; }
    if ((remote._t || 0) > (local._t || 0)) { this.lsSet(p, remote); return remote; }
    return local;
  },

  async set(p,o){
    o._t = Date.now();
    const ok = this.lsSet(p,o);                       // the write that matters, and it is synchronous
    if (!ok) toast("This browser refused to save — a private window blocks storage.");
    if (this.db) {                                    // best effort, never blocks the UI
      try { this.db.doc(p).set(o).catch(e => { lastError = "store write " + p + ": " + ((e && e.code) || e); }); }
      catch (e) { lastError = "store write " + p + ": " + ((e && e.message) || e); }
    }
    return ok;
  },
};

function addEntry(trackId, min, label, date){
  if (!(min > 0)) return null;
  const d = date || ymd(new Date()), k = weekKey(parseYmd(d));
  const e = { id:Math.random().toString(36).slice(2,9), track:trackId, min:Math.round(min),
              label:label || track(trackId).name, date:d };
  if (k === S.weekKey) { S.week.entries.push(e); saveWeek(); }
  else Store.get("logs/"+k).then(w => {
    const wk = w && Array.isArray(w.entries) ? w : { entries:[], days:{} };
    wk.entries.push(e); Store.set("logs/"+k, wk);
  });
  return e;
}

function streak(h){
  const due = new Set(h.days), today = ymd(new Date());
  let n = 0, d = new Date(), g = 0;
  while (g++ < 500) {
    const k = ymd(d);
    if (due.has(d.getDay())) { if (isChecked(h.id,k)) n++; else if (k !== today) break; }
    d = addDays(d,-1);
  }
  return n;
}

/* A task repeats on chosen weekdays, or every day, or not at all.
   rep: "" | "daily" | "days"   rdays: [0-6] when rep is "days" */
const DAYINIT = ["S","M","T","W","T","F","S"];
function normalizeRepeat(t){                       // older shapes still in the store
  if (t.rep === "weekly") { t.rep = "days"; t.rdays = [ (t.due ? parseYmd(t.due) : new Date()).getDay() ]; }
  else if (t.rep === "weekdays") { t.rep = "days"; t.rdays = [1,2,3,4,5]; }
  if (t.rep === "days" && !(t.rdays || []).length) t.rep = "";
  return t;
}
/* the next date on or after `from` that the pattern allows */
function matchDate(rep, rdays, from){
  if (rep === "daily") return ymd(from);
  if (rep !== "days" || !(rdays || []).length) return "";
  for (let i = 0; i < 14; i++) {
    const d = addDays(from, i);
    if (rdays.includes(d.getDay())) return ymd(d);
  }
  return "";
}
const nextOccurrence = t => matchDate(t.rep, t.rdays, addDays(t.due ? parseYmd(t.due) : new Date(), 1));
function repeatLabel(t){
  if (t.rep === "daily") return "every day";
  if (t.rep !== "days" || !(t.rdays || []).length) return "";
  const r = t.rdays.slice().sort();
  if (r.join() === "1,2,3,4,5") return "weekdays";
  if (r.length === 7) return "every day";
  if (r.length === 1) return "every " + DAYNAME[r[0]];
  return r.map(d => DAYSHORT[d]).join(" · ");
}
/* the strip of weekday toggles, used on the add row and in the editor */
function daysStrip(rdays, attr, id){
  return `<span class="dstrip">${[0,1,2,3,4,5,6].map(d =>

      aria-pressed="${(rdays||[]).includes(d)}" aria-label="${DAYNAME[d]}"
      title="${DAYNAME[d]}">${DAYINIT[d]}</button>`).join("")}</span>`;
}

/* ticking a task is now the main way time gets logged */
function completeTask(t, date){
  t.done = true; t.doneAt = date;
  if (t.est > 0) {
    const e = addEntry(t.k, t.est, t.t, date);
    t.entry = e && e.id;
  }
  const due = t.rep ? nextOccurrence(t) : "";
  if (due) {
    S.tasks.items.push({ id:Math.random().toString(36).slice(2,9), t:t.t, k:t.k, p:t.p,
      est:t.est, d:t.d, due, rep:t.rep, rdays:t.rdays, done:false });   // starts unstarred
    return due;
  }
  return "";
}
function uncompleteTask(t){
  if (t.entry) { S.week.entries = S.week.entries.filter(e => e.id !== t.entry); saveWeek(); }
  t.done = false; t.doneAt = null; t.entry = null;
}
function bucket(t){
  const today = ymd(new Date());
  if (t.done) return "done";
  if (!t.due) return "later";
  if (t.due < today) return "late";
  if (t.due === today) return "today";
  return t.due <= ymd(addDays(mondayOf(new Date()),6)) ? "week" : "later";
}

/* a deliberately tiny markup: "- " makes a bullet, **stars** emphasise */
function fmtNote(txt){
  const bold = x => x.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  let out = "", list = false;
  esc(txt).split("\n").forEach(raw => {
    const l = raw.trim();
    if (/^[-•]\s+/.test(l)) {
      if (!list) { out += "<ul>"; list = true; }
      out += "<li>" + bold(l.replace(/^[-•]\s+/,"")) + "</li>";
    } else {
      if (list) { out += "</ul>"; list = false; }
      if (l) out += "<p>" + bold(l) + "</p>";
    }
  });
  return out + (list ? "</ul>" : "");
}

/* consecutive days where every task on the list got done */
function clearedStreak(){
  let n = 0, d = new Date(), guard = 0;
  while (guard++ < 400) {
    const k = ymd(d);
    if (isChecked("__cleared", k)) n++;
    else if (k !== ymd(new Date())) break;
    d = addDays(d, -1);
  }
  return n;
}

const CHEERS = ["Nice.", "That's one.", "Good.", "Down.", "Got it.", "Yes.", "Clean.", "Next."];

function challengeCard(mine, load, doneMin){
  const total = mine.length, done = mine.filter(t => t.done).length, left = total - done;
  if (!total) return "";
  const pct = done / total, all = left === 0;
  const C = 264, streak = clearedStreak();

  let head, sub;
  if (all) {
    head = "Day cleared.";
    sub = `${total} task${total===1?"":"s"}, ${hm(doneMin)} logged${
      streak > 1 ? ` · <b>${streak} days in a row</b>` : ""}. Close the laptop.`;
  } else if (done === 0) {
    head = `${left} to go.`;
    sub = `Star three, start with one. ${load > 300
      ? "<b>This is more than an evening holds</b> — move what will not fit rather than failing it here."
      : "You do not have to see the end to take the first one."}`;
  } else if (pct < .25) {
    head = `${left} left.`;  sub = "Started is the hard part, and it is behind you.";
  } else if (pct < .5) {
    head = `${left} left.`;  sub = "A quarter down. Keep the same order, do not reshuffle.";
  } else if (pct < .75) {
    head = `${left} left.`;  sub = "Past halfway. The back half runs faster than the front.";
  } else if (left > 1) {
    head = `${left} left.`;  sub = "Three quarters. Do not stop to admire it.";
  } else {
    head = "One left.";      sub = "One task between you and a cleared day.";
  }

  return `<div class="chal ${all?"won":""}">
    <div class="ring">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle class="tr" cx="50" cy="50" r="42"></circle>
        <circle class="pg" cx="50" cy="50" r="42"
          style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-pct)}"></circle>
      </svg>
      <div class="rn"><b>${all?"\u2605":left}</b><span>${all?"cleared":"left"}</span></div>
    </div>
    <div class="chal-b">
      <span class="lab">${all?"Today":"Today's challenge"}</span>
      <p class="chal-h">${head}</p>
      <div class="pips">${[.25,.5,.75,1].map((m,i) => {
        const prev = i ? [.25,.5,.75,1][i-1] : 0;
        const f = Math.max(0, Math.min(1, (pct - prev) / (m - prev)));
        return `<div class="pip ${f>=1?"hit":""}" data-tip="${Math.round(m*100)}% — ${
          Math.ceil(m*total)} of ${total}"><i style="--f:${f}"></i></div>`;
      }).join("")}</div>
      <p class="chal-s">${sub}</p>
    </div>
    <span class="sr" role="status">${done} of ${total} tasks done</span>
  </div>`;
}

/* turn free text into proposed tasks — Claude when available, lines otherwise */
function splitLines(text){
  return text.split(/\n+|(?:[.;]\s+(?=[A-Z]))/).map(x => x.replace(/^[\s\-•*\d.)]+/,"").trim())
    .filter(x => x.length > 2)
    .map(t => ({ t: t.length > 90 ? t.slice(0,87)+"…" : t, d:"", k:"rest", est:30, p:2, day:"" }));
}

function cleanProposals(arr){
  const ids = S.cfg.tracks.map(t => t.id);
  return (Array.isArray(arr) ? arr : []).slice(0,40).map(x => ({
    t: String(x && x.t || "").slice(0,120).trim(),
    k: ids.includes(x && x.k) ? x.k : "rest",
    d: String(x && x.d || "").slice(0,2000),
    est: Math.max(0, Math.min(600, Math.round(+(x && x.est) || 30))),
    p: [1,2,3].includes(+(x && x.p)) ? +x.p : 2,
    day: /^\d{4}-\d{2}-\d{2}$/.test(x && x.day) ? x.day : "",
  })).filter(x => x.t);
}

async function breakDown(){
  const text = S.dump.text.trim();
  if (!text) return toast("Write the dump first.");
  S.dump.busy = true; render();
  const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
  if (!sample) {
    S.dump.proposals = splitLines(text); S.dump.busy = false; render();
    return toast("Split by line — edit anything that came out wrong.");
  }
  try {
    const out = await sample.json(
      "Turn this brain dump into a concrete task list.\n\n" +
      "Track ids you may use: " + S.cfg.tracks.map(t => t.id+" = "+t.name).join("; ") + ".\n" +
      "Today is " + DAYNAME[new Date().getDay()] + ".\n\n" +
      "Return ONLY a JSON array. Each element: {\"t\": an actionable title starting with a verb, " +
      "under 80 characters; \"k\": one track id from the list; \"est\": realistic minutes as a multiple " +
      "of 15; \"d\": the specifics from the dump that belong to this task, kept in the owner's own " +
      "words, as short lines each starting with \"- \", with the parts that must not be forgotten " +
      "wrapped in **double stars**; \"p\": 1 for must, 2 for should, 3 for someday; \"day\": \"" + ymd(new Date()) +
      "\" when it plainly has to happen today, otherwise \"\" }.\n\n" +
      "Rules: split anything over 2 hours into separate tasks. Do not invent work that is not in the dump, " +
      "but never drop a detail either — every specific in the dump must survive in some task's \"d\". " +
      "Do not merge unrelated items.\n\n" +
      "Dump:\n" + text,
      { modelTier:"default" });
    const props = cleanProposals(out);
    S.dump.proposals = props.length ? props : splitLines(text);
    if (!props.length) toast("Fell back to splitting by line.");
  } catch (e) {
    S.dump.proposals = splitLines(text);
    toast(e && e.code === "rate_limited" ? "Too many requests — split by line instead."
      : "Split by line — edit anything that came out wrong.");
  }
  S.dump.busy = false; render();
}

/* ═══ REPORT (with the week's log folded in) ══════════════════════════════ */
function reportData(){
  const mon = mondayOf(addDays(new Date(), -7*S.offset));
  const days = Array.from({length:7}, (_,i) => ymd(addDays(mon,i)));
  const today = ymd(new Date()), elapsed = days.filter(d => d <= today);
  const logged = {}, plan = {};
  S.week.entries.forEach(e => logged[e.track] = (logged[e.track]||0)+e.min);
  // what you planned this week = the estimates on the tasks you gave these days
  S.tasks.items.forEach(t => { if (days.includes(t.due) || (t.done && days.includes(t.doneAt)))
    plan[t.k] = (plan[t.k]||0) + (t.est||0); });

  const rows = S.cfg.tracks.map(t => ({ id:t.id, name:t.name, dom:t.dom,
    logged:logged[t.id]||0, planned:plan[t.id]||0, target:t.target*60 }))
    .sort((a,b) => b.logged-a.logged || b.planned-a.planned);

  // plan adherence = did the tasks you put on a day actually happen
  let due = 0, hit = 0;
  elapsed.forEach(d => S.tasks.items.forEach(t => {
    if (t.due === d || (t.done && t.doneAt === d)) { due++; if (t.done && t.doneAt === d) hit++; }
  }));

  const habitRows = S.cfg.habits.map(h => {
    const cells = days.map(d => ({ d, due:h.days.includes(parseYmd(d).getDay()),
      on:isChecked(h.id,d), soon:d > today }));
    return { h, cells, due:cells.filter(c => c.due && !c.soon).length,
             hit:cells.filter(c => c.due && c.on).length };
  });

  return { days, elapsed, rows, blocksDue:due, blocksDone:hit, habitRows,
    total:rows.reduce((s,r) => s+r.logged, 0),
    energy:elapsed.map(d => (S.week.days[d]||{}).energy||0).filter(Boolean),
    tasksDone:S.tasks.items.filter(t => t.done && days.includes(t.doneAt)).length,
    late:S.tasks.items.filter(t => bucket(t) === "late").length, today };
}

function narrate(R){
  const real = R.rows.filter(r => r.logged > 0);
  if (!real.length) return "Nothing logged this week yet. Tick a block on Today, or add one entry by hand.";
  const top = real[0];
  const starved = R.rows.filter(r => r.target > 0 && r.logged < r.target*.34)
    .sort((a,b) => (b.target-b.logged)-(a.target-a.logged)).slice(0,2);
  const faith = R.habitRows.filter(x => x.h.track === "faith");
  const fd = faith.reduce((s,x) => s+x.due, 0), fh = faith.reduce((s,x) => s+x.hit, 0);
  const adh = R.blocksDue ? Math.round(R.blocksDone/R.blocksDue*100) : 0;
  const avg = R.energy.length ? R.energy.reduce((a,b) => a+b, 0)/R.energy.length : 0;
  const out = [];
  out.push(`You logged <b>${hm(R.total)}</b>, and <b>${esc(top.name)}</b> took the biggest share at ${hm(top.logged)}.`);
  out.push(`You kept <b>${adh}%</b> of the blocks you planned${adh>=70?" — a working week, not a lucky one."
    :adh>=40?", so the plan is roughly right but the evenings are losing.":". The plan is fiction right now; cut it rather than try harder."}`);
  if (fd) out.push(`On what you said matters most: <b>${fh} of ${fd}</b> faith checks. ${fh/fd>=.7?"Hold that.":"Move it earlier, before the day can take it."}`);
  if (starved.length) out.push(`<b>${starved.map(s=>esc(s.name)).join("</b> and <b>")}</b> got almost nothing — ${starved.length>1?"pick one and give it":"give it"} a named block next week.`);
  if (R.late) out.push(`<b>${R.late}</b> ${R.late===1?"task has":"tasks have"} been carried over from an earlier day. Do ${R.late===1?"it":"them"} first, or delete ${R.late===1?"it":"them"} honestly.`);
  if (avg) out.push(`Average energy <b>${avg.toFixed(1)}/5</b>${avg<3?" — watch this before pushing harder on anything.":"."}`);
  return out.join(" ");
}

/* ═══ RENDER ═════════════════════════════════════════════════════════════ */
const TABS = [["today","Today"],["backlog","Backlog"],["report","Report"]];
const VIEWS = { today:viewToday, backlog:viewBacklog, report:viewReport, setup:viewSetup };

function render(){
  $("#tabs").innerHTML = TABS.map(([id,l]) =>
    `<button class="tab" role="tab" data-tab="${id}" aria-selected="${S.tab===id}">${l}</button>`).join("");
  $("#gear").setAttribute("aria-selected", S.tab === "setup");

  const d = new Date();
  $("#stamp").textContent = d.toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"})
    + (Store.mode === "db" ? "" : " · local");

  const v = $("#view");
  try { v.innerHTML = (VIEWS[S.tab] || viewToday)(); }
  catch (e) {
    lastError = (e && e.stack) || String(e); console.error(e);
    v.innerHTML = `<div class="empty" style="margin-top:20px">
      <b>This view could not be drawn.</b><br>Your data is safe — switch tabs, or reload.
      <br><span class="mono" style="font-size:11px">${esc(String(e && e.message || e))}</span></div>`;
  }
  bindTips(v);
}

/* ── events ──────────────────────────────────────────────────────────────
   One delegated listener on #view, attached once at boot. Nothing is
   re-bound on render, so a failure in any single handler cannot leave the
   page looking alive but dead to clicks. Every handler is wrapped: an
   error surfaces as a message instead of killing the rest of the app. */

const CLICK_KEYS = ["task","star","open","edit","cancel","save","del","move","ep","er","eday",
  "prio","nrep","nday","habit","energy","bible","quick","px","pd","pp","delentry","blk"];
const CHANGE_KEYS = ["pt","pk","pz","pn","target"];

function findHit(node, keys){
  for (let el = node; el && el !== document.body; el = el.parentElement) {
    if (el.id && ACTIONS[el.id]) return { id: el.id, el };
    if (el.dataset) for (const k of keys) if (k in el.dataset) return { key:k, val:el.dataset[k], el };
  }
  return null;
}
const cut = v => { const i = v.indexOf(":"); return i < 0 ? [v,""] : [v.slice(0,i), v.slice(i+1)]; };
const findTask = id => S.tasks.items.find(x => x.id === id);
const today = () => ymd(new Date());

function guard(fn){
  try { fn(); }
  catch (e) {
    lastError = (e && e.message) || String(e);
    console.error(e);
    toast("Something went wrong there — the rest still works.");
  }
}

/* ── id-triggered actions ─────────────────────────────────────────────── */
const ACTIONS = {
  nadd(el){
    const box = el.closest(".card") || document;
    const title = ($("#nt", box).value || "").trim();
    if (!title) return $("#nt", box).focus();
    const N = S.newTask;
    const due = N.rep ? matchDate(N.rep, N.rdays, new Date())
              : el.dataset.where === "today" ? today() : "";
    S.tasks.items.push({ id:Math.random().toString(36).slice(2,9), t:title, k:$("#nk",box).value,
      due, est:+$("#ne",box).value || 0, p:S.prio, rep:N.rep, rdays:N.rdays.slice(), d:"", done:false });
    saveTasks(); render();
    if (due && due !== today())
      toast("First one on " + parseYmd(due).toLocaleDateString(undefined,
        { weekday:"long", month:"short", day:"numeric" }));
    const again = $("#nt"); if (again) again.focus();
  },
  tstart(){ const k = $("#tsel").value;
    S.timer = { track:k, label:track(k).name, startedAt:Date.now() }; saveTimer(); render(); },
  tstop(){
    const m = Math.max(1, Math.round((Date.now()-S.timer.startedAt)/60000));
    addEntry(S.timer.track, m, S.timer.label, today());
    toast("Logged " + hm(m) + " to " + track(S.timer.track).name);
    S.timer = null; saveTimer(); render();
  },
  tcancel(){ S.timer = null; saveTimer(); render(); },
  eadd(){
    const m = +$("#em").value;
    if (!(m > 0)) return $("#em").focus();
    addEntry($("#ek").value, m, ($("#et").value || "").trim() || null, $("#ed").value);
    toast("Logged " + hm(m)); render();
  },
  dbreak(){ const d = $("#dump"); if (d) S.dump.text = d.value; breakDown(); },
  dclear(){ S.dump = { text:"", proposals:[], busy:false }; saveDump(); render(); },
  paddall(){
    const add = S.dump.proposals.filter(x => (x.t||"").trim());
    if (!add.length) return toast("Nothing to add.");
    add.forEach(x => S.tasks.items.push({ id:Math.random().toString(36).slice(2,9),
      t:x.t.trim(), k:x.k, d:x.d || "", due:x.day || "", est:x.est || 0, p:x.p,
      rep:"", rdays:[], done:false }));
    S.dump = { text:"", proposals:[], busy:false }; saveDump(); saveTasks(); render();
    toast(add.length + " task" + (add.length===1?"":"s") + " added");
  },
  pallt(){ S.dump.proposals.forEach(pr => pr.day = today()); saveDump(); render();
    toast("All set for today"); },
  pallb(){ S.dump.proposals.forEach(pr => pr.day = ""); saveDump(); render();
    toast("All going to the backlog"); },
  expandall(){
    const list = todayList().filter(t => t.d), any = list.some(t => S.open[t.id]);
    list.forEach(t => { if (any) delete S.open[t.id]; else S.open[t.id] = 1; });
    render();
  },
  gotodump(){ S.tab = "backlog"; render();
    setTimeout(() => { const d = $("#dump"); if (d) d.focus(); }, 40); },
  prevw(){ S.offset++; S.narrative = "";
    loadWeek(weekKey(addDays(new Date(), -7*S.offset))).then(render); },
  nextw(){ if (!S.offset) return; S.offset--; S.narrative = "";
    loadWeek(weekKey(addDays(new Date(), -7*S.offset))).then(render); },
  tbl(){ S.showTable = !S.showTable; render(); },
  reflect(el){ askReflection(el); },
  exp(){ doExport(); },
  imp(){ const f = $("#impf"); if (f) f.click(); },
  vsave(){
    try {
      const v = JSON.parse($("#vrs").value);
      if (!Array.isArray(v) || !v.length) throw new Error("needs to be a non-empty list");
      v.forEach((x,i) => { if (!Array.isArray(x) || x.length < 2 || !String(x[1]).trim())
        throw new Error("item " + (i+1) + " must be [“reference”, “text”]"); });
      S.cfg.verses = v.map(x => [String(x[0]), String(x[1])]);
      saveCfg(); toast("Verses saved"); render();
    } catch (e) { $("#vmsg").innerHTML = '<span style="color:var(--late)">'+esc(e.message)+"</span>"; }
  },
  vreset(){ delete S.cfg.verses; saveCfg(); render(); toast("Back to the KJV set"); },
};

/* ── data-attribute actions ───────────────────────────────────────────── */
const HANDLERS = {
  task(id){
    const t = findTask(id), date = today();
    if (!t) return;
    if (t.done) {
      uncompleteTask(t);
      if (isChecked("__cleared", date)) toggleHabit("__cleared", date);
      saveTasks(); render(); return;
    }
    const nextDue = completeTask(t, date);
    saveTasks();
    const list = todayList(), total = list.length, left = list.filter(x => !x.done).length;
    const doneN = total - left;
    if (total && !left && !isChecked("__cleared", date)) checkOn("__cleared", date);
    render();
    if (total && !left) {
      celebrate();
      const st = clearedStreak();
      return toast(st > 1 ? "Day cleared — " + st + " in a row." : "Day cleared. Every single one.");
    }
    const pct = total ? doneN/total : 0, prev = total ? (doneN-1)/total : 0;
    const mile = [.25,.5,.75].find(m => prev < m && pct >= m);
    if (mile) return toast(Math.round(mile*100) + "% down — " + left + " to go");
    toast(CHEERS[Math.floor(Math.random()*CHEERS.length)]
      + (t.est ? " Logged " + hm(t.est) + "." : "")
      + (nextDue ? " Back on " + parseYmd(nextDue).toLocaleDateString(undefined,{weekday:"long"}) + "." : ""));
  },
  star(id){
    const t = findTask(id);
    if (!t || t.done) return;
    if (t.s) { t.s = 0; saveTasks(); render(); return; }
    const day = t.due || "";
    if (starsOn(day) >= STAR_LIMIT)
      return toast(day ? "Three is the limit for one day — unstar one first"
                       : "Three starred in the backlog already");
    t.s = 1; saveTasks(); render();
    toast("Starred — " + starsOn(day) + " of " + STAR_LIMIT + " for the day");
  },
  open(id){ if (S.open[id]) delete S.open[id]; else S.open[id] = 1; render(); },
  edit(id){ S.editing = S.editing === id ? null : id;
    if (S.editing && S.tab !== "backlog" && !onToday(findTask(id) || {})) S.tab = "backlog";
    render(); },
  cancel(){ S.editing = null; render(); },
  save(id){
    const t = findTask(id);
    if (!t) return;
    const title = ($("#ei-"+id).value || "").trim();
    if (!title) return $("#ei-"+id).focus();
    t.t = title;
    t.k = $("#ec-"+id).value;
    t.est = +$("#ez-"+id).value || 0;
    t.d = ($("#ed-"+id).value || "").trim();
    S.editing = null; saveTasks(); render(); toast("Saved");
  },
  del(id){ S.tasks.items = S.tasks.items.filter(x => x.id !== id);
    if (S.editing === id) S.editing = null; saveTasks(); render(); },
  move(id){
    const t = findTask(id);
    if (!t) return;
    const toBacklog = onToday(t);
    t.due = toBacklog ? "" : today();
    let dropped = false;
    if (t.s && starsOn(t.due) > STAR_LIMIT) { t.s = 0; dropped = true; }
    saveTasks(); render();
    toast(toBacklog ? "Back in the backlog"
      : dropped ? "On today's list — unstarred, today already has three" : "On today's list");
  },
  ep(v){ const [id,n] = cut(v), t = findTask(id); if (t) { t.p = +n; saveTasks(); render(); } },
  er(v){
    const [id,r] = cut(v), t = findTask(id);
    if (!t) return;
    t.rep = r === "once" ? "" : "daily";
    if (r === "once") t.rdays = [];
    if (t.rep && !t.due) t.due = today();
    saveTasks(); render();
    toast(t.rep ? "Repeats " + repeatLabel(t) : "No longer repeats");
  },
  eday(v){
    const [id,d] = cut(v), t = findTask(id);
    if (!t) return;
    const set = new Set(t.rdays || []);
    set.has(+d) ? set.delete(+d) : set.add(+d);
    t.rdays = Array.from(set).sort();
    t.rep = t.rdays.length ? "days" : "";
    if (t.rep && !t.due) t.due = matchDate(t.rep, t.rdays, new Date());
    saveTasks(); render();
  },
  prio(v){ S.prio = +v; render(); },
  nrep(v){ S.newTask = v === "daily" ? { rep:"daily", rdays:[] } : { rep:"", rdays:[] }; render(); },
  nday(v){
    const d = +cut(v)[1], set = new Set(S.newTask.rdays || []);
    set.has(d) ? set.delete(d) : set.add(d);
    const rdays = Array.from(set).sort();
    S.newTask = { rep: rdays.length ? "days" : "", rdays };
    render();
  },
  habit(id){ toggleHabit(id, today()); render(); },
  energy(v){ const rec = dayRec(today()), n = +v;
    rec.energy = rec.energy === n ? 0 : n; saveWeek(); render(); },
  bible(v){
    const n = +v;
    S.cfg.bible.day = Math.max(0, Math.min(S.cfg.bible.total, S.cfg.bible.day + n));
    if (n > 0) { checkOn("bible", today()); checkOn("quiet", today()); }
    saveCfg(); render();
  },
  quick(v){ const k = $("#tsel").value, m = +v;
    addEntry(k, m, track(k).name, today()); toast("Logged " + hm(m)); render(); },
  px(i){ S.dump.proposals.splice(+i, 1); saveDump(); render(); },
  pd(v){ const [i,day] = cut(v); S.dump.proposals[+i].day = day; saveDump(); render(); },
  pp(v){ const [i,n] = cut(v); S.dump.proposals[+i].p = +n; saveDump(); render(); },
  delentry(id){ S.week.entries = S.week.entries.filter(e => e.id !== id); saveWeek(); render(); },
  blk(){ /* fixed blocks were removed; kept so an old cached page cannot throw */ },
};

function bindEvents(){
  document.querySelector("header").addEventListener("click", ev => guard(() => {
    const tab = ev.target.closest("[data-tab]");
    if (tab) { S.tab = tab.dataset.tab; S.narrative = ""; return render(); }
    if (ev.target.closest("#gear")) { S.tab = S.tab === "setup" ? "today" : "setup"; render(); }
  }));

  const view = $("#view");
  view.addEventListener("click", ev => {
    const hit = findHit(ev.target, CLICK_KEYS);
    if (!hit) return;
    guard(() => { if (hit.id) ACTIONS[hit.id](hit.el); else HANDLERS[hit.key](hit.val, hit.el); });
  });

  view.addEventListener("change", ev => {
    const el = ev.target, id = el.id || "";
    guard(() => {
      const hit = findHit(el, CHANGE_KEYS);
      if (hit && hit.key === "pt") { S.dump.proposals[+hit.val].t = el.value.trim(); return saveDump(); }
      if (hit && hit.key === "pk") { S.dump.proposals[+hit.val].k = el.value; saveDump(); return render(); }
      if (hit && hit.key === "pz") { S.dump.proposals[+hit.val].est = +el.value || 0; return saveDump(); }
      if (hit && hit.key === "pn") { S.dump.proposals[+hit.val].d = el.value; return saveDump(); }
      if (hit && hit.key === "target") { track(hit.val).target = Math.max(0, +el.value || 0);
        saveCfg(); return toast("Target updated"); }
      if (id === "one")    { dayRec(today()).one = el.value.trim(); saveWeek(); return toast("Saved"); }
      if (id === "note")   { dayRec(today()).note = el.value.trim(); saveWeek(); return toast("Saved"); }
      if (id === "bday")   { S.cfg.bible.day = Math.max(0, Math.min(S.cfg.bible.total, +el.value || 0));
        saveCfg(); return render(); }
      if (id === "bstart") { S.cfg.bible.start = el.value; return saveCfg(); }
      if (id === "btotal") { S.cfg.bible.total = Math.max(1, +el.value || 365); return saveCfg(); }
      if (id === "impf")   { return doImport(el.files[0]); }
    });
  });

  view.addEventListener("input", ev => {
    if (ev.target.id === "dump") { S.dump.text = ev.target.value; saveDump(); }   // no re-render
  });

  view.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && ev.target.id === "nt") {
      const btn = $("#nadd", ev.target.closest(".card") || document);
      if (btn) guard(() => ACTIONS.nadd(btn));
    }
  });
}

/* a short burst of paper — the only animation in the app, and it has to earn it */
function celebrate(){
  if (window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = document.createElement("canvas");
  cv.className = "confetti"; document.body.appendChild(cv);
  const ctx = cv.getContext("2d"), dpr = window.devicePixelRatio || 1;
  const W = cv.width = innerWidth*dpr, H = cv.height = innerHeight*dpr;
  cv.style.width = innerWidth+"px"; cv.style.height = innerHeight+"px";
  const cols = ["#E8497D","#E0A11B","#7A43C9","#0F8060","#FF8A6B","#D62C72"];
  const bits = Array.from({length:150}, () => ({
    x: W*(.15+Math.random()*.7), y: H*.42 + (Math.random()-.5)*60*dpr,
    vx: (Math.random()-.5)*12*dpr, vy: (-8-Math.random()*10)*dpr,
    r: (3.5+Math.random()*4.5)*dpr, c: cols[(Math.random()*cols.length)|0],
    a: Math.random()*6.3, va: (Math.random()-.5)*.32,
  }));
  const t0 = performance.now();
  (function frame(now){
    const el = now - t0;
    ctx.clearRect(0,0,W,H);
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, el-1500)/1400);
    bits.forEach(p => {
      p.vy += .33*dpr; p.vx *= .994; p.x += p.vx; p.y += p.vy; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
      ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r*.45, p.r*2, p.r*.9);
      ctx.restore();
    });
    if (el < 2900) requestAnimationFrame(frame); else cv.remove();
  })(t0);
}

/* ── reflection ────────────────────────────────────────────────────────── */
async function askReflection(btn){
  btn.disabled = true; btn.textContent = "thinking…";
  const sample = window.claude && window.claude.use ? await window.claude.use("sample") : null;
  if (!sample) { btn.disabled = false; btn.textContent = "ask for a reflection";
    return toast("Reflections need the hosted version."); }
  const R = reportData();
  const facts = {
    hoursLogged:+(R.total/60).toFixed(1),
    blocksKept:R.blocksDue ? Math.round(R.blocksDone/R.blocksDue*100)+"%" : "n/a",
    byTrack:S.cfg.tracks.map(t => R.rows.find(r => r.id === t.id)).filter(r => r && (r.logged||r.target))
      .map(r => ({ track:r.name, logged:+(r.logged/60).toFixed(1), target:r.target/60 })),
    habits:R.habitRows.map(x => ({ habit:x.h.name, hit:x.hit, due:x.due })),
    tasksFinished:R.tasksDone, tasksLate:R.late,
    energyByDay:R.elapsed.map(d => (S.week.days[d]||{}).energy||null),
    notes:R.elapsed.map(d => (S.week.days[d]||{}).note).filter(Boolean),
  };
  try {
    const out = await sample(
      "Below is one week from a personal time tracker. Each track has hours logged against a weekly target " +
      "the owner set themselves; habits show hits against the days they were due. The owner is carrying more " +
      "tracks than one week holds, and the tracks are listed in the owner's own priority order.\n\n" +
      "Write 3-5 sentences, second person, plain and warm but not soft. Name what the data actually shows, " +
      "name the single thing to cut or move next week, and end with one concrete sentence to act on Monday. " +
      "No lists, no headings, no preamble, no praise for logging. Use only the numbers given; invent nothing.\n\n"
      + JSON.stringify(facts),
      { modelTier:"default", onText: ({ text }) => {
          S.narrative = text;
          const box = $("#narrbox");
          if (box) { let p = $("#live");
            if (!p) { p = document.createElement("p"); p.id = "live"; box.appendChild(p); }
            p.textContent = text; }
        } });
    S.narrative = out.text; render();
  } catch (e) {
    btn.disabled = false; btn.textContent = "ask for a reflection";
    toast(e && e.code === "not_granted" ? "Reflections are off for this page."
      : e && e.code === "rate_limited" ? "Too many requests — try in a minute."
      : "Could not get a reflection just now.");
  }
}

/* ── export / import ───────────────────────────────────────────────────── */
async function doExport(){
  const weeks = {};
  for (let i = 0; i < 26; i++) {
    const k = weekKey(addDays(new Date(), -7*i));
    const w = await Store.get("logs/"+k);
    if (w) weeks[k] = w;
  }
  const json = JSON.stringify({ app:"first-things-first", exported:new Date().toISOString(),
    config:S.cfg, tasks:S.tasks, checks:S.checks, weeks }, null, 2);
  const name = "first-things-first-"+ymd(new Date())+".json";
  const dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null;
  if (dl) { try { await dl.save({ filename:name, data:json }); return toast("Exported"); } catch (_) {} }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([json], { type:"application/json" }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href); toast("Exported");
}

function doImport(file){
  if (!file) return;
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const b = JSON.parse(fr.result);
      if (b.config) { S.cfg = b.config; await Store.set("app/config", S.cfg); }
      if (b.tasks)  { S.tasks = b.tasks; await Store.set("app/tasks", S.tasks); }
      if (b.checks) { S.checks = b.checks; await Store.set("app/checks", S.checks); }
      if (b.weeks) for (const k of Object.keys(b.weeks)) await Store.set("logs/"+k, b.weeks[k]);
      await loadWeek(weekKey(new Date())); render(); toast("Backup restored");
    } catch (_) { toast("That is not a First Things First backup."); }
  };
  fr.readAsText(file);
}

/* A list handed to the page at publish time (seed.js), installed once and
   never again. This is the delivery path that does not depend on the
   shared store being reachable. */
function installSeed(){
  const seed = window.__SEED_TASKS;
  if (!seed || !Array.isArray(seed.items) || !seed.items.length) return;
  const done = Store.lsGet("app/seeded") || { keys: [] };
  if (done.keys.indexOf(seed.key) >= 0) return;
  const have = new Set(S.tasks.items.map(t => t.id));
  const added = seed.items.filter(t => !have.has(t.id));
  S.tasks.items = S.tasks.items.concat(added);
  done.keys.push(seed.key);
  Store.set("app/seeded", done);
  Store.set("app/tasks", S.tasks);
  if (added.length) setTimeout(() => toast(added.length + " tasks loaded"), 700);
}

/* ── migrations ────────────────────────────────────────────────────────── */

/* v4 — no rhythm, no archive, no fixed blocks. Tasks are the whole plan. */
function migrate(){
  if ((S.cfg.v || 1) >= CFG_VERSION) return;
  delete S.cfg.rhythm; delete S.cfg.rhythmArchive;
  const ct = S.cfg.tracks.find(t => t.id === "contract");
  if (ct && /Saturday/i.test(ct.next || "")) ct.next = "All of it Monday evening";
  S.tasks.items.forEach(normalizeRepeat);
  S.cfg.v = CFG_VERSION;
  Store.set("app/config", S.cfg); Store.set("app/tasks", S.tasks);
}

/* ── boot ──────────────────────────────────────────────────────────────── */
async function boot(carried){
  if (carried && carried.tab) { S.tab = carried.tab; S.offset = carried.offset||0; }
  bindEvents();          // before anything can fail, so the page is never dead to clicks
  render();
  try { await load(); } catch (e) {
    lastError = (e && e.stack) || String(e); console.error(e);
    toast("Some of your data could not be loaded — see Setup.");
  }
  render();
  setInterval(() => {
    const c = $("#clk");
    if (c && S.timer && S.timer.startedAt) {
      const el = Math.floor((Date.now()-S.timer.startedAt)/1000);
      c.textContent = pad(Math.floor(el/3600))+":"+pad(Math.floor(el/60)%60)+":"+pad(el%60);
    }
  }, 1000);
  setInterval(() => { if (S.tab === "today") render(); }, 120000);
}

async function load(){
  await Store.connect();

  S.cfg = await Store.get("app/config");
  if (!S.cfg || !Array.isArray(S.cfg.tracks)) { S.cfg = SEED_CONFIG(); await Store.set("app/config", S.cfg); }
  SEED_TRACKS.forEach(st => { if (!S.cfg.tracks.some(t => t.id === st.id)) S.cfg.tracks.push({ ...st }); });
  if (!S.cfg.habits) S.cfg.habits = SEED_HABITS.map(h => ({ ...h }));
  if (!S.cfg.bible)  S.cfg.bible  = SEED_CONFIG().bible;

  const tk = await Store.get("app/tasks");
  if (tk && Array.isArray(tk.items)) { S.tasks = tk; S.tasks.items.forEach(normalizeRepeat); }
  installSeed();

  const dmp = await Store.get("app/dump");
  if (dmp) S.dump = { text:dmp.text || "", proposals:Array.isArray(dmp.proposals)?dmp.proposals:[], busy:false };

  migrate();                       // needs both the config and the backlog in hand

  S.checks = (await Store.get("app/checks")) || {};
  const tm = await Store.get("app/timer");
  S.timer = tm && tm.startedAt ? tm : null;
  await loadWeek(weekKey(new Date()));
}

if (window.claude && window.claude.hot) window.claude.hot.snapshot(() => ({ tab:S.tab, offset:S.offset }));
S.cfg = SEED_CONFIG();
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
</script>
